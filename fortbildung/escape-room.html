/* Layout: Sicherheitskonsole der Physik-Sammlung. Oben eine Statusleiste (Countdown, 4 Schlossmodule mit Codezeichen),
   darunter genau ein Panel pro Systemcheck. Einziges Thema (dunkle Konsole) – bewusst, im Stil von AURORA-6. */
:root{
  --space:#070B16; --space2:#0D1426; --panel:#121B33; --panel2:#182443; --line:#27345C; --line2:#3A4C7E;
  --ink:#EAF0FF; --muted:#9FAED0; --dim:#6B7AA3;
  --cyan:#55D6F0; --cyan-ink:#06212B; --cyan-soft:rgba(85,214,240,.14);
  --orange:#FF9A3D; --orange-soft:rgba(255,154,61,.16);
  --green:#5FE3A1; --green-ink:#062615; --green-soft:rgba(95,227,161,.16);
  --red:#FF5468; --red-soft:rgba(255,84,104,.16);
  --gold:#F4C95D;
  --font-display:"Orbitron","Segoe UI",Roboto,system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-s:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--space); color:var(--ink);
  font-family:var(--font-body); font-size:17px; line-height:1.45;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 42%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 72%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 66%, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(ellipse at 50% -20%, #16224A 0%, transparent 60%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
body.alarm::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
  box-shadow:inset 0 0 0 3px var(--red), inset 0 0 90px rgba(255,84,104,.35);
  animation:alarm 1.2s ease-in-out infinite;
}
@keyframes alarm{50%{opacity:.25}}
body::after{ /* Scanlines */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:40;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
}
.wrap{
  max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:14px;
  padding-top:max(14px,env(safe-area-inset-top,0px)); padding-bottom:48px;
  padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px));
}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; touch-action:manipulation}
h1,h2,h3{font-family:var(--font-display); letter-spacing:.03em; text-wrap:balance; margin:0}
p{margin:0}
.eyebrow{font-family:var(--font-display); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
[hidden]{display:none!important}

/* ---------- Statusleiste ---------- */
.hud{
  position:sticky; top:0; z-index:30; display:flex; flex-direction:column; gap:10px;
  background:linear-gradient(180deg,rgba(24,36,67,.97),rgba(18,27,51,.97)); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 12px; backdrop-filter:blur(6px);
}
.hud-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand svg{width:34px; height:34px; flex:none}
.brand b{font-family:var(--font-display); font-size:.95rem; letter-spacing:.06em; display:block; line-height:1.1}
.brand span{font-size:.76rem; color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hud-right{display:flex; align-items:center; gap:8px; flex:none}
.timer{
  font-family:var(--font-mono); font-weight:700; font-size:1.25rem; font-variant-numeric:tabular-nums;
  padding:4px 12px; border-radius:999px; border:1px solid var(--line2); background:var(--space2); min-width:5.4ch; text-align:center
}
.timer.warn{color:var(--orange); border-color:var(--orange)}
.timer.over{color:var(--red); border-color:var(--red); animation:alarm 1s infinite}
.iconbtn{width:38px; height:38px; border-radius:50%; border:1px solid var(--line2); background:var(--space2); display:grid; place-items:center; color:var(--muted)}
.iconbtn svg{width:20px; height:20px}
.locks{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.lock{
  display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--r-s); border:1px solid var(--line);
  background:var(--space2); min-width:0; transition:all .4s
}
.lock .ch{
  font-family:var(--font-display); font-weight:900; font-size:1.15rem; width:1.6em; height:1.6em; border-radius:8px;
  display:grid; place-items:center; background:var(--panel2); color:var(--dim); flex:none
}
.lock small{font-family:var(--font-display); font-size:.56rem; letter-spacing:.1em; color:var(--dim); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lock.active{border-color:var(--cyan); box-shadow:0 0 18px rgba(85,214,240,.18)}
.lock.active small{color:var(--cyan)}
.lock.done{border-color:var(--green); background:var(--green-soft)}
.lock.done .ch{background:var(--green); color:var(--green-ink); animation:pop .5s}
.lock.done small{color:var(--green)}
@keyframes pop{40%{transform:scale(1.35)}}
@media (max-width:420px){ .lock small{display:none} .lock{justify-content:center} }

/* ---------- Panels ---------- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; position:relative; overflow:hidden}
.panel.glow{box-shadow:0 0 0 1px rgba(85,214,240,.22), 0 0 50px rgba(85,214,240,.07)}
.stage{display:flex; flex-direction:column; gap:14px; animation:enter .45s ease-out}
@keyframes enter{from{opacity:0; transform:translateY(14px)}}
.stage-head{display:flex; flex-direction:column; gap:6px}
.stage-head h2{font-size:clamp(1.15rem,4.4vw,1.55rem)}
.sam{
  font-family:var(--font-mono); font-size:.93rem; line-height:1.55; background:var(--space2); border:1px solid var(--line);
  border-left:4px solid var(--cyan); border-radius:var(--r-s); padding:12px 14px; min-height:3.2em; white-space:pre-wrap
}
.sam b{color:var(--cyan)}
.sam .cur{display:inline-block; width:.55em; height:1.05em; background:var(--cyan); vertical-align:-2px; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.feedback{font-family:var(--font-mono); font-size:.9rem; min-height:1.4em; color:var(--muted)}
.feedback.err{color:var(--red)}
.feedback.ok{color:var(--green)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.btn{
  font-family:var(--font-display); font-weight:700; letter-spacing:.06em; font-size:.92rem;
  padding:13px 20px; border-radius:12px; background:var(--cyan); color:var(--cyan-ink);
  box-shadow:0 0 0 1px rgba(85,214,240,.4), 0 6px 26px rgba(85,214,240,.25); transition:transform .1s, opacity .2s
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none}
.btn.ghost{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--line2)}
.btn.big{font-size:1.05rem; padding:16px 26px}
.hint{display:none; font-size:.92rem; color:var(--gold); background:rgba(244,201,93,.08); border:1px dashed rgba(244,201,93,.4); border-radius:var(--r-s); padding:10px 12px}
.hint.show{display:block; animation:enter .3s}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Freigabe-Overlay im Panel */
.unlock{
  position:fixed; inset:0; display:grid; place-items:center; background:rgba(7,11,22,.9); z-index:45;
  animation:enter .3s; backdrop-filter:blur(3px); padding:16px; text-align:center
}
.unlock .inner{display:flex; flex-direction:column; align-items:center; gap:10px; max-width:440px}
.unlock .codechar{
  font-family:var(--font-display); font-weight:900; font-size:4.4rem; color:var(--green); line-height:1;
  width:1.5em; height:1.5em; border-radius:22px; display:grid; place-items:center; background:var(--green-soft);
  box-shadow:0 0 0 2px var(--green), 0 0 60px rgba(95,227,161,.45); animation:pop .6s
}
.unlock .lab{font-family:var(--font-display); letter-spacing:.14em; font-size:.8rem; color:var(--green)}
.unlock p{color:var(--muted); font-size:.95rem}

/* ---------- Intro ---------- */
.intro{display:flex; flex-direction:column; gap:16px; text-align:center; align-items:center; padding-top:4vh}
.siren{width:84px; height:84px}
.siren .lamp{animation:alarm 1s infinite}
.glitch{
  font-family:var(--font-display); font-weight:900; font-size:clamp(2.3rem,11vw,4.4rem); letter-spacing:.08em; color:var(--red);
  text-shadow:0 0 24px rgba(255,84,104,.55); position:relative; line-height:1
}
.glitch::before,.glitch::after{content:attr(data-t); position:absolute; inset:0; overflow:hidden}
.glitch::before{color:var(--cyan); transform:translate(2px,0); clip-path:inset(0 0 60% 0); animation:gl 2.4s infinite steps(2); opacity:.7}
.glitch::after{color:var(--orange); transform:translate(-2px,0); clip-path:inset(55% 0 0 0); animation:gl 1.9s infinite steps(2) reverse; opacity:.7}
@keyframes gl{0%{transform:translate(0)}20%{transform:translate(3px,-1px)}40%{transform:translate(-3px,1px)}60%{transform:translate(2px,1px)}80%{transform:translate(-1px,-1px)}}
.intro .sub{font-family:var(--font-display); letter-spacing:.18em; font-size:.8rem; color:var(--muted); text-transform:uppercase}
.intro .sam{text-align:left; width:100%}
.teams{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.team{
  font-family:var(--font-display); font-size:.74rem; letter-spacing:.08em; padding:9px 13px; border-radius:999px;
  border:1px solid var(--line2); background:var(--space2); color:var(--muted)
}
.team[aria-pressed="true"]{border-color:var(--cyan); color:var(--cyan-ink); background:var(--cyan)}
.facts{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.fact{font-size:.82rem; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:5px 11px}

/* ---------- Check 1: Karten ---------- */
.cards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (min-width:620px){ .cards{grid-template-columns:repeat(4,minmax(0,1fr))} }
.card{
  display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; padding:12px; border-radius:12px;
  background:var(--space2); border:1px solid var(--line); position:relative; transition:border-color .2s, background .2s, transform .1s; min-height:112px
}
.card:active{transform:scale(.98)}
.card svg{width:30px; height:30px; color:var(--cyan)}
.card b{font-size:.96rem; line-height:1.2}
.card small{font-size:.78rem; color:var(--muted); line-height:1.3}
.card[aria-pressed="true"]{border-color:var(--cyan); background:var(--cyan-soft); box-shadow:0 0 0 1px var(--cyan) inset}
.card[aria-pressed="true"]::after{
  content:"✓"; position:absolute; top:8px; right:10px; width:22px; height:22px; border-radius:50%; background:var(--cyan); color:var(--cyan-ink);
  font-weight:700; font-size:.8rem; display:grid; place-items:center
}
.card.wrong{border-color:var(--red); background:var(--red-soft)}
.card.wrong svg{color:var(--red)}
.card.right{border-color:var(--green); background:var(--green-soft)}
.card.right svg{color:var(--green)}
.card .why{font-family:var(--font-mono); font-size:.72rem; color:var(--red)}
.counter{font-family:var(--font-mono); font-size:.9rem; color:var(--muted)}

/* ---------- Check 2: Getriebe ---------- */
.gearbox{background:radial-gradient(ellipse at 50% 40%, #16224A, var(--space2) 70%); border:1px solid var(--line); border-radius:12px; padding:6px}
.gearbox svg{width:100%; max-width:560px; margin:0 auto; height:auto; display:block; touch-action:none}
.gear-body{fill:#2A3B6B; stroke:#6E86C7; stroke-width:1.4}
.gear.fixed .gear-body{fill:#3B2C55; stroke:var(--orange)}
.gearbox:not(.running) .gear.fixed{animation:motor 1.4s ease-in-out infinite}
@keyframes motor{50%{opacity:.6}}
.gear.placed .gear-body{fill:#1E4A5E; stroke:var(--cyan)}
.gearbox.running .gear .gear-body{stroke:var(--green)}
.gear-hub{fill:#0D1426; stroke:#6E86C7; stroke-width:1.2}
.slot-ring{fill:rgba(85,214,240,.04); stroke:var(--line2); stroke-width:2; stroke-dasharray:6 6}
.slot.target .slot-ring{stroke:var(--cyan); fill:rgba(85,214,240,.12); animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.slot-num{font-family:var(--font-display); font-weight:900; font-size:20px; fill:var(--dim)}
.glabel{font-family:var(--font-body); font-size:13.5px; fill:var(--muted); text-anchor:middle}
.glabel .t1{font-weight:700; fill:var(--ink)}
.glabel.on .t1{fill:var(--cyan)}
.hubtxt{font-family:var(--font-display); font-weight:900; fill:var(--green); font-size:24px; text-anchor:middle; dominant-baseline:central}
.tray{display:flex; gap:10px; flex-wrap:wrap}
.tgear{
  display:flex; align-items:center; gap:9px; padding:10px 14px 10px 10px; border-radius:12px; background:var(--space2);
  border:1px solid var(--line2); font-weight:700; font-size:.95rem; touch-action:none; user-select:none; -webkit-user-select:none
}
.tgear svg{width:30px; height:30px}
.tgear[aria-pressed="true"]{border-color:var(--cyan); background:var(--cyan-soft); box-shadow:0 0 0 1px var(--cyan) inset}
.tgear.used{opacity:.25; pointer-events:none}
.dragghost{position:fixed; z-index:100; pointer-events:none; width:70px; height:70px; margin:-35px 0 0 -35px; filter:drop-shadow(0 6px 18px rgba(85,214,240,.5))}

/* ---------- Check 3: Funk ---------- */
.radio{background:#0A1222; border:1px solid var(--line2); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px}
.radio canvas{width:100%; height:120px; display:block; border-radius:10px; background:#06101C}
.radio-top{display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:var(--font-mono); font-size:.78rem; color:var(--dim)}
.led{width:10px; height:10px; border-radius:50%; background:#24324F; display:inline-block; margin-right:6px; vertical-align:0}
.led.on{background:var(--green); box-shadow:0 0 10px var(--green)}
.subs{font-size:1.02rem; min-height:3.1em; color:var(--ink); background:rgba(0,0,0,.35); border-radius:8px; padding:8px 12px; text-align:center}
.subs:empty::before{content:"Untertitel erscheinen hier"; color:var(--dim); font-size:.85rem}
.keys{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.key{
  font-family:var(--font-display); font-weight:700; font-size:1.2rem; padding:12px 0; border-radius:10px; background:var(--space2);
  border:1px solid var(--line2)
}
.key:active{background:var(--cyan-soft)}

/* ---------- Check 4: Cryptex ---------- */
.cryptex{display:flex; align-items:center; justify-content:center; gap:0; padding:10px 0; position:relative}
.cap{
  width:34px; height:150px; border-radius:16px; background:linear-gradient(90deg,#4A3A1C,#C9A24E 45%,#7A5E28);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25); transition:transform .9s cubic-bezier(.6,-.2,.3,1.3); flex:none
}
.cap.l{border-radius:18px 6px 6px 18px} .cap.r{border-radius:6px 18px 18px 6px}
.cryptex.open .cap.l{transform:translateX(-26px) rotate(-6deg)}
.cryptex.open .cap.r{transform:translateX(26px) rotate(6deg)}
.rings{display:flex; gap:3px; background:#3A2E15; padding:0 3px}
.ring{display:flex; flex-direction:column; align-items:center; width:clamp(46px,13vw,62px)}
.rbtn{width:100%; height:32px; display:grid; place-items:center; color:var(--gold); font-size:1rem}
.rwin{
  width:100%; height:110px; overflow:hidden; position:relative; border-radius:6px;
  background:linear-gradient(180deg,#5B4720 0%,#E2C27A 30%,#F4DFA6 50%,#E2C27A 70%,#5B4720 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)
}
.rstrip{position:absolute; left:0; right:0; top:0; transition:transform .25s ease-out}
.rstrip span{display:grid; place-items:center; height:37px; font-family:var(--font-display); font-weight:900; font-size:1.5rem; color:#2B1E06}
.rwin::after{content:""; position:absolute; left:-2px; right:-2px; top:36px; height:38px; border-top:2px solid rgba(43,30,6,.5); border-bottom:2px solid rgba(43,30,6,.5); pointer-events:none}
.cryptex.open .rwin{box-shadow:inset 0 0 0 2px var(--green), 0 0 18px rgba(95,227,161,.5)}
.phrase{font-family:var(--font-display); font-size:clamp(1rem,4vw,1.25rem); text-align:center; letter-spacing:.04em}
.phrase em{font-style:normal; color:var(--gold)}
.limits{display:grid; gap:8px; grid-template-columns:1fr}
@media (min-width:620px){ .limits{grid-template-columns:repeat(3,1fr)} }
.limit{display:flex; gap:8px; align-items:flex-start; font-size:.88rem; color:var(--muted); background:var(--space2); border:1px solid var(--line); border-radius:10px; padding:9px 10px}
.limit svg{width:18px; height:18px; flex:none; color:var(--orange); margin-top:2px}

/* ---------- Tresor ---------- */
.vault-wrap{display:grid; gap:14px; grid-template-columns:1fr; align-items:center}
@media (min-width:640px){ .vault-wrap{grid-template-columns:1.1fr 1fr} }
.vault{perspective:900px; display:grid; place-items:center; position:relative}
.vault-inner{position:absolute; width:78%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#2A2410,#0A0A06 70%); display:grid; place-items:center}
.vault-inner .key svg{width:100%; height:auto; display:block; filter:drop-shadow(0 0 14px rgba(244,201,93,.6))}
.vault-inner .key{opacity:0; transform:scale(.4); transition:all .8s .9s; background:none; border:0; padding:0; width:52%}
.vault.open .vault-inner .key{opacity:1; transform:scale(1)}
.door{width:86%; max-width:320px; transform-origin:8% 50%; transition:transform 1.6s cubic-bezier(.5,0,.2,1) .8s; position:relative; z-index:2}
.vault.open .door{transform:rotateY(-112deg)}
.door svg{width:100%; height:auto; display:block}
.wheel{transform-origin:150px 150px; transition:transform 1.2s cubic-bezier(.5,0,.2,1)}
.vault.open .wheel{transform:rotate(540deg)}
.codebox{display:flex; flex-direction:column; gap:12px}
.display{display:flex; gap:8px; justify-content:center}
.display span{
  width:56px; height:64px; border-radius:10px; background:#06101C; border:1px solid var(--line2); display:grid; place-items:center;
  font-family:var(--font-display); font-weight:900; font-size:2rem; color:var(--green)
}
.display span.cur{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pad .key{font-size:1.3rem; padding:13px 0}
.pad .key.alt{color:var(--gold)}

/* ---------- Sieg ---------- */
#confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
.win{text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center}
.win h1{font-size:clamp(1.6rem,7vw,2.6rem); color:var(--green); text-shadow:0 0 28px rgba(95,227,161,.45)}
.stat{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.stat div{background:var(--space2); border:1px solid var(--line2); border-radius:12px; padding:10px 16px; min-width:120px}
.stat b{display:block; font-family:var(--font-display); font-size:1.5rem; color:var(--cyan)}
.stat small{color:var(--muted); font-size:.8rem}
.reveal{text-align:left; display:flex; flex-direction:column; gap:10px}
.reveal li{margin:2px 0}
.reveal ul{margin:0; padding-left:20px; color:var(--muted)}

/* Zeit abgelaufen */
.toast{
  position:fixed; left:50%; bottom:max(18px,env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:70;
  background:var(--panel2); border:1px solid var(--red); color:var(--ink); border-radius:14px; padding:12px 16px; width:min(92vw,520px);
  box-shadow:0 10px 40px rgba(0,0,0,.5); display:flex; gap:12px; align-items:center; animation:enter .3s
}
.toast b{color:var(--red); font-family:var(--font-display); font-size:.85rem; letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}
</style>
</head>

/* ================= Sound (WebAudio, synthetisch) ================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; } } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function tone(f, d=.12, type="sine", vol=.12, when=0, slide=0){
  if(muted) return; const c=ac(); if(!c) return;
  const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.05);
}
function noise(d=.15, vol=.15, when=0, freq=1200){
  if(muted) return; const c=ac(); if(!c) return;
  const t=c.currentTime+when, b=c.createBuffer(1, Math.floor(c.sampleRate*d), c.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  f.type="bandpass"; f.frequency.value=freq; g.gain.value=vol; s.buffer=b; s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SFX = {
  tap(){ tone(880,.05,"square",.04); },
  ok(){ [660,880,1320].forEach((f,i)=>tone(f,.16,"triangle",.12,i*.08)); },
  err(){ tone(160,.28,"sawtooth",.09); tone(120,.3,"sawtooth",.07,.05); },
  unlock(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,.22,"triangle",.11,i*.07)); noise(.25,.06,.35,3000); },
  siren(){ for(let i=0;i<3;i++){ tone(620,.32,"sawtooth",.05,i*.62,940); tone(940,.3,"sawtooth",.05,i*.62+.31,620); } },
  clank(){ noise(.09,.22,0,700); tone(220,.08,"square",.05); },
  click(){ noise(.03,.15,0,2600); },
  rumble(){ tone(60,1.4,"sawtooth",.08,0,40); noise(1.2,.08,.2,300); },
  type(){ if(Math.random()<.35) tone(1500+Math.random()*400,.015,"square",.012); },
};

/* ================= Hilfsfunktionen ================= */
function fmt(sec){ const neg=sec<0; sec=Math.abs(Math.round(sec)); return (neg?"+":"")+Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
let typer=null;
function typeInto(el, html, speed=13){
  if(typer){ clearInterval(typer.id); typer=null; }
  const tmp=document.createElement("div"); tmp.innerHTML=html; const full=tmp.textContent;
  let i=0; el.innerHTML='<span class="cur"></span>';
  const done=()=>{ clearInterval(id); typer=null; el.innerHTML=html; };
  const id=setInterval(()=>{ i+=2; SFX.type(); if(i>=full.length){ done(); return; } el.textContent=full.slice(0,i); el.insertAdjacentHTML("beforeend",'<span class="cur"></span>'); }, speed);
  typer={id,done}; el.onclick=()=>typer&&typer.done();
}
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

function hud(){

        <button class="iconbtn" id="snd" aria-label="Ton an/aus">${muted?I.mute:I.sound}</button>

    <div class="locks">${LOCKNAMES.map((n,i)=>{

    </div>
  </header>`;
}
function bindHud(){
  $("#snd").onclick=()=>{ muted=!muted; $("#snd").innerHTML=muted?I.mute:I.sound; if(muted){ const a=$("#funk"); a.pause(); } };
  tick();
}
let tickId=null, timeoutShown=false;
function elapsed(){ return S.start ? ((S.end||Date.now())-S.start)/1000 : 0; }
function tick(){
  const el=$("#timer"); if(!el) return;
  const left=TOTAL-elapsed();
  el.textContent=fmt(left);
  el.classList.toggle("warn", left<=60 && left>0);
  el.classList.toggle("over", left<=0 && !S.end);
  if(left<=0 && !S.end && !timeoutShown){ timeoutShown=true; showTimeout(); }
}
function startTicking(){ if(tickId) clearInterval(tickId); tickId=setInterval(tick,250); }
function showTimeout(){
  SFX.siren();
  const t=document.createElement("div"); t.className="toast";
  t.innerHTML=`<div style="flex:1"><b>ZEIT ABGELAUFEN</b><div style="font-size:.92rem;color:var(--muted)">S.A.M. drückt ein Auge zu – spielt weiter, die Zeit läuft als Nachspielzeit.</div></div><button class="btn ghost" style="padding:8px 12px">OK</button>`;
  document.body.appendChild(t); t.querySelector("button").onclick=()=>t.remove(); setTimeout(()=>t.remove(),7000);
}

function c1(){
  const order=[...CARDS];
  stageShell(1, "Was liefert Claude für die Experimentierstunde?",
    `<b>S.A.M.:</b> Materialanforderung für NW 6 – Doppelstunde „Wie atmen wir?“ mit Lungenmodell aus PET-Flaschen.\nWählt die <b>4 Dinge</b>, die Claude für diese Stunde vorbereitet hat.`,

     <div class="row" style="justify-content:space-between"><span class="counter" id="cnt">0 / 4 gewählt</span><button class="btn" id="send" disabled>Anfordern</button></div>`,
    `Claude erstellt Dokumente und Dateien. Alles, wofür man Hände braucht, bleibt bei euch.`);
  const sel=new Set();
  const upd=()=>{ $("#cnt").textContent=sel.size+" / 4 gewählt"; $("#send").disabled = sel.size!==4; };
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id; b.classList.remove("wrong"); const w=b.querySelector(".why"); if(w) w.remove();
    if(sel.has(id)){ sel.delete(id); b.setAttribute("aria-pressed","false"); }
    else{ if(sel.size>=4){ shake($("#cnt")); SFX.err(); return; } sel.add(id); b.setAttribute("aria-pressed","true"); }

  });
  $("#send").onclick=()=>{
    const wrong=[...sel].filter(id=>!CARDS.find(c=>c.id===id).ok);
    if(!wrong.length){
      app.querySelectorAll(".card").forEach(b=>{ if(sel.has(b.dataset.id)) b.classList.add("right"); });
      fb("Anforderung bestätigt.","ok");
      setTimeout(()=>solve(0,"Verlaufsplan mit Materialliste, Tafelbild und Gefährdungsbeurteilung kommen fertig – bauen, kopieren und experimentieren bleibt bei euch."),450);
      return;
    }
    SFX.err();
    wrong.forEach(id=>{ const b=app.querySelector(`.card[data-id="${id}"]`); const c=CARDS.find(x=>x.id===id);
      sel.delete(id); b.setAttribute("aria-pressed","false"); b.classList.add("wrong"); shake(b);
      b.insertAdjacentHTML("beforeend",`<span class="why">${c.why}</span>`); });
    upd(); fb(`${wrong.length===1?"Eine Karte passt":wrong.length+" Karten passen"} nicht. Tauscht sie aus.`,"err");
  };
}

/* ---------- Check 2: Getriebe ---------- */
const GN=12, GR=40, GA=7, GD=6;
function gearPath(){
  const s=2*Math.PI/GN, ro=GR+GA, rr=GR-GD; let d="";
  const P=(r,a)=>(r*Math.cos(a)).toFixed(2)+" "+(r*Math.sin(a)).toFixed(2);
  for(let k=0;k<GN;k++){ const a=k*s;
    d+=(k?"L":"M")+P(rr,a-.5*s)+"L"+P(rr,a-.26*s)+"L"+P(ro,a-.12*s)+"L"+P(ro,a+.12*s)+"L"+P(rr,a+.26*s)+"L"+P(rr,a+.5*s); }
  d+="Z"; // Speichenlöcher
  for(let k=0;k<5;k++){ const a=k*2*Math.PI/5+.3, cx=24*Math.cos(a), cy=24*Math.sin(a), r=5.5;
    d+=`M${(cx+r).toFixed(2)} ${cy.toFixed(2)}a${r} ${r} 0 1 0 ${-2*r} 0a${r} ${r} 0 1 0 ${2*r} 0Z`; }
  return d;
}
const GPATH=gearPath();
function gearSVG(size=30, cls=""){ return `<svg viewBox="-50 -50 100 100" width="${size}" height="${size}" aria-hidden="true"><path d="${GPATH}" fill-rule="evenodd" class="gear-body ${cls}" style="fill:#1E4A5E;stroke:#55D6F0;stroke-width:3"/><circle r="11" class="gear-hub"/></svg>`; }
const GPOS=[[75,100],[144.28,140],[213.56,100],[282.84,140]];
const GINFO=[
  {name:"Stunden", hint:"der Reihe", fixed:true, up:true},
  {name:"Checkliste", hint:["Ich-kann-Sätze","mit Nummern"], short:"Ich-kann-Sätze", up:false},
  {name:"Probeklausur", hint:["Aufgaben verweisen","auf die Nummern"], short:"verweist auf die Nummern", up:true},
  {name:"Übungs-Apps", hint:["Nummer antippen","→ passende App"], short:"per Nummer gefunden", up:false},
];
function c2(){
  stageShell(2, "Bringt das Getriebe zum Laufen",
    `<b>S.A.M.:</b> Der Riegel wird über ein Getriebe bewegt. Es läuft nur, wenn das Material ineinandergreift.\nZieht jedes Zahnrad auf die passende Achse – oder erst antippen, dann die Achse antippen.`,
    `<div class="gearbox" id="gb"><svg viewBox="0 0 360 236" id="gsvg" role="img" aria-label="Getriebe mit vier Achsen"></svg></div>
     <div class="tray" id="tray"></div>`,
    `Die Reihenfolge wie in meinem Unterricht: Aus den Stunden entsteht die Checkliste, die Probeklausur verweist auf ihre Nummern, und über die Nummern findet man die passende App.`);
  const svg=$("#gsvg");
  // Phasen so wählen, dass die Zähne exakt kämmen: δA + δB = 180/N
  const step=360/GN, ph=[0]; const dirs=[1,-1,1,-1];
  for(let i=1;i<4;i++){ const [ax,ay]=GPOS[i-1],[bx,by]=GPOS[i]; const th=Math.atan2(by-ay,bx-ax)*180/Math.PI;
    const dA=((th-ph[i-1])%step+step)%step; ph[i]=th+180-(step/2-dA); }
  let html="";
  GPOS.forEach(([x,y],i)=>{ const g=GINFO[i]; const ly=g.up?y-GR-GA-24:y+GR+GA+18;
    html+=`<g class="slot" data-slot="${i}" transform="translate(${x} ${y})" ${i? 'style="cursor:pointer"':""}>
      <circle r="${GR+GA+2}" class="slot-ring" ${i?"":'style="display:none"'}/>
      ${i?`<text class="slot-num" text-anchor="middle" dominant-baseline="central">${i+1}</text>`:""}
      <g class="gear ${g.fixed?"fixed":""}" id="gear${i}" ${g.fixed?"":'style="display:none"'}><g class="rot"><path d="${GPATH}" fill-rule="evenodd" class="gear-body"/></g><circle r="13" class="gear-hub"/><text class="hubtxt" id="hub${i}" style="font-size:15px;fill:var(--orange)">${i?"":"▶"}</text></g>
    </g>
    <text class="glabel ${g.fixed?"on":""}" id="lab${i}" x="${x}" y="${ly}"><tspan class="t1" x="${x}">${g.fixed?g.name:(g.hint[0])}</tspan><tspan x="${x}" dy="16">${g.fixed?g.hint:g.hint[1]}</tspan></text>`; });
  svg.innerHTML=html;
  const tray=$("#tray"); const names=[2,1,3]; // gemischt
  tray.innerHTML=names.map(i=>`<button class="tgear" data-g="${i}" aria-pressed="false">${gearSVG(30)}${GINFO[i].name}</button>`).join("");
  let picked=null; const placed=[true,false,false,false];
  let t0=performance.now(), running=false, raf=0;
  const spin=()=>{ const t=(performance.now()-t0)/1000; const w=70;
    for(let i=0;i<4;i++){ if(!running) break; const r=svg.querySelector(`#gear${i} .rot`); if(r) r.setAttribute("transform",`rotate(${(ph[i]+dirs[i]*w*t).toFixed(2)})`); }
    raf=requestAnimationFrame(spin); };
  for(let i=0;i<4;i++) svg.querySelector(`#gear${i} .rot`).setAttribute("transform",`rotate(${ph[i]})`);
  spin();
  const pick=b=>{ tray.querySelectorAll(".tgear").forEach(x=>x.setAttribute("aria-pressed", x===b)); picked=b?+b.dataset.g:null;
    svg.querySelectorAll(".slot").forEach(s=>s.classList.toggle("target", picked!=null && !placed[+s.dataset.slot])); };
  const tryPlace=(g,slot)=>{
    if(placed[slot]) return;
    if(g!==slot){ SFX.err(); const s=svg.querySelector(`.slot[data-slot="${slot}"]`); shake(s);
      fb(`${GINFO[g].name} passt nicht auf Achse ${slot+1}. Lest den Hinweis an der Achse.`,"err"); return; }
    placed[slot]=true; SFX.clank(); fb(`${GINFO[g].name} sitzt.`,"ok");
    const gear=svg.querySelector("#gear"+slot); gear.style.display=""; gear.classList.add("placed");
    svg.querySelector(`.slot[data-slot="${slot}"] .slot-ring`).style.display="none";
    svg.querySelector(`.slot[data-slot="${slot}"] .slot-num`).style.display="none";
    const lab=svg.querySelector("#lab"+slot); lab.classList.add("on"); lab.querySelector(".t1").textContent=GINFO[slot].name;
    lab.querySelectorAll("tspan")[1].textContent=GINFO[slot].short;
    tray.querySelector(`.tgear[data-g="${g}"]`).classList.add("used"); pick(null);
    if(placed.every(Boolean)){
      running=true; t0=performance.now(); $("#gb").classList.add("running");
      [0,1,2,3].forEach(i=>{ const h=svg.querySelector("#hub"+i); h.textContent=""; });
      let n=0; const cl=setInterval(()=>{ SFX.click(); if(++n>10) clearInterval(cl); },140);
      fb("Das Getriebe läuft – alles greift ineinander.","ok");
      setTimeout(()=>{ const h=svg.querySelector("#hub3"); h.textContent=CODE[1]; h.style.fill="var(--green)"; h.style.fontSize="20px"; },900);
      setTimeout(()=>solve(1,"Stunden → Checkliste → Probeklausur → App: Die Nummern der Checkliste tauchen überall wieder auf. Wer bei Nr. 13 „unsicher“ ankreuzt, findet direkt die passende Übung."),2200);
    }
  };
  // Antippen
  tray.querySelectorAll(".tgear").forEach(b=>{
    b.addEventListener("click",()=>{ if(dragMoved) return; SFX.tap(); pick(picked===+b.dataset.g?null:b); });
  });
  svg.querySelectorAll(".slot").forEach(s=>s.addEventListener("click",()=>{ const i=+s.dataset.slot; if(!i) return;
    if(picked==null){ fb("Erst ein Zahnrad unten antippen.",""); return; } tryPlace(picked,i); }));
  // Ziehen
  let ghost=null, dragG=null, dragMoved=false, sx=0, sy=0;
  const slotAt=(x,y)=>{ let best=null, bd=1e9; const r=svg.getBoundingClientRect(), k=r.width/360;
    GPOS.forEach(([gx,gy],i)=>{ if(!i) return; const px=r.left+gx*k, py=r.top+gy*k, d=Math.hypot(px-x,py-y); if(d<bd){bd=d; best=i;} });
    return bd< 62*k ? best : null; };
  tray.querySelectorAll(".tgear").forEach(b=>{
    b.addEventListener("pointerdown",e=>{ dragG=+b.dataset.g; dragMoved=false; sx=e.clientX; sy=e.clientY; b.setPointerCapture(e.pointerId); });
    b.addEventListener("pointermove",e=>{ if(dragG==null) return;
      if(!dragMoved && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ dragMoved=true; ghost=document.createElement("div"); ghost.className="dragghost"; ghost.innerHTML=gearSVG(70); document.body.appendChild(ghost); pick(b); }
      if(ghost){ ghost.style.left=e.clientX+"px"; ghost.style.top=e.clientY+"px"; const s=slotAt(e.clientX,e.clientY);
        svg.querySelectorAll(".slot").forEach(x=>x.classList.toggle("target", +x.dataset.slot===s && !placed[s])); } });
    const end=e=>{ if(dragG==null) return; const g=dragG; dragG=null;
      if(ghost){ ghost.remove(); ghost=null; const s=slotAt(e.clientX,e.clientY); if(s!=null) tryPlace(g,s); else pick(null); setTimeout(()=>dragMoved=false,30); } };
    b.addEventListener("pointerup",end); b.addEventListener("pointercancel",end);
  });
}

       <div class="radio-top"><span><span class="led" id="led"></span>KANAL 6 · NW-TRAKT</span><span id="rt">00:00 / 00:22</span></div>
       <canvas id="osc" width="700" height="240" aria-hidden="true"></canvas>
       <div class="subs" id="subs" aria-live="polite"></div>
       <button class="btn" id="play">▶ Funkspruch abspielen</button>
     </div>
     <div class="eyebrow">Ziffer eingeben</div>
     <div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="key" data-n="${n}">${n}</button>`).join("")}</div>`,
    `Kein Ton? Die Untertitel laufen beim Abspielen mit. Die Ziffer steht im vierten Satz.`);
  const a=$("#funk"), cv=$("#osc"), cx=cv.getContext("2d");
  let an=null, buf=null, srcNode=null;
  const setupAnalyser=()=>{ const c=ac(); if(!c||an) return; try{ srcNode=srcNode||c.createMediaElementSource(a); an=c.createAnalyser(); an.fftSize=1024; srcNode.connect(an); an.connect(c.destination); buf=new Uint8Array(an.fftSize); }catch(e){ an=null; } };
  let raf=0; const draw=()=>{
    const W=cv.width,H=cv.height; cx.fillStyle="#06101C"; cx.fillRect(0,0,W,H);
    cx.strokeStyle="rgba(85,214,240,.10)"; cx.lineWidth=1;
    for(let x=0;x<W;x+=50){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
    for(let y=0;y<H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
    cx.strokeStyle="#5FE3A1"; cx.lineWidth=3; cx.shadowColor="#5FE3A1"; cx.shadowBlur=12; cx.beginPath();
    const playing=!a.paused;
    for(let i=0;i<W;i+=4){ let v;
      if(an && playing){ an.getByteTimeDomainData(buf); v=(buf[Math.floor(i/W*buf.length)]-128)/128*1.6; }
      else if(playing){ v=Math.sin(i*.05+performance.now()/90)*Math.sin(performance.now()/300)*.5*Math.random(); }
      else v=(Math.random()-.5)*.03;
      const y=H/2+v*H*.42; i?cx.lineTo(i,y):cx.moveTo(i,y); }
    cx.stroke(); cx.shadowBlur=0;
    const t=a.currentTime||0; $("#rt").textContent=`00:${String(Math.floor(t)).padStart(2,"0")} / 00:22`;
    const s=SUBS.find(s=>t>=s.t0 && t<=s.t1+.4); const el=$("#subs"); if(el){ const txt=s?s.text:(playing?"":el.textContent); if(el.textContent!==txt) el.textContent=txt; }
    $("#led").classList.toggle("on",playing);
    raf=requestAnimationFrame(draw); };
  draw();
  $("#play").onclick=()=>{ ac(); setupAnalyser(); noise(.25,.08,0,1800); a.currentTime=0; a.muted=muted; const p=a.play(); if(p&&p.catch) p.catch(()=>{});
    $("#play").textContent="↻ Noch einmal abspielen"; };
  a.onended=()=>{ $("#subs").textContent="Die dritte Stelle des Tresorcodes lautet: DREI."; };
  app.querySelectorAll(".key").forEach(k=>k.onclick=()=>{ SFX.tap();
    if(k.dataset.n==="3"){ a.pause(); cancelAnimationFrame(raf); fb("Empfangen.","ok");
      setTimeout(()=>solve(2,"Am Ende jeder Reihe erstellt Claude ein Erklärvideo: Sprechertext, Animationen, Untertitel – vertont mit derselben künstlichen Stimme."),300); }
    else{ SFX.err(); shake(k); fb("Falsche Ziffer – hört euch den Funkspruch noch einmal an.","err"); } });
}

/* ---------- Check 4: Cryptex ---------- */
const RINGS=[["K","T","P","L","M","S"],["O","H","R","I","L","E"],["E","Ä","I","Ü","Ö","A"],["S","L","F","C","K","T"],["N","E","T","R","A","S"]];
const TARGET="PRÜFE";
function c4(){
  stageShell(4, "Öffnet den Cryptex",
    `<b>S.A.M.:</b> Letzter Check: die Grenzen. KI macht Fehler – darum gilt ein Grundsatz.\nStellt das Wort ein und öffnet den Cryptex.`,
    `<div class="limits">
       <div class="limit">${I.warn}<span>Handschrift ist nicht immer sicher lesbar.</span></div>
       <div class="limit">${I.warn}<span>Korrekturzeichen sitzen nicht immer an der richtigen Stelle.</span></div>
       <div class="limit">${I.warn}<span>Fehler kommen vor – die Note verantwortet die Lehrkraft.</span></div>
     </div>
     <div class="phrase">„Claude bereitet vor – ich&nbsp;<em style="white-space:nowrap">_&#8239;_&#8239;_&#8239;_&#8239;_</em>.“</div>
     <div class="cryptex" id="cx"><div class="cap l"></div><div class="rings" id="rings"></div><div class="cap r"></div></div>
     <div class="row" style="justify-content:center"><button class="btn" id="open">Öffnen</button></div>`,
    `Was tut man mit jedem Ergebnis, bevor man es verwendet? Ein Verb mit 5 Buchstaben, 3. Buchstabe Ü.`);
  const pos=RINGS.map((r,i)=>i===2?0:Math.floor(Math.random()*r.length));
  // Startposition darf nicht schon die Lösung sein
  if(RINGS.every((r,i)=>r[pos[i]]===TARGET[i])) pos[0]=(pos[0]+1)%RINGS[0].length;
  const ringsEl=$("#rings");
  ringsEl.innerHTML=RINGS.map((r,i)=>`<div class="ring" data-r="${i}">
      <button class="rbtn up" aria-label="Ring ${i+1} hoch">▲</button>
      <div class="rwin"><div class="rstrip">${[...r,...r,...r].map(c=>`<span>${c}</span>`).join("")}</div></div>
      <button class="rbtn down" aria-label="Ring ${i+1} runter">▼</button></div>`).join("");
  const H=37;
  const show=(i,anim=true)=>{ const n=RINGS[i].length; const strip=ringsEl.querySelector(`.ring[data-r="${i}"] .rstrip`);
    strip.style.transition=anim?"":"none"; strip.style.transform=`translateY(${-(n+pos[i]-1)*H}px)`; };
  RINGS.forEach((_,i)=>show(i,false));
  const turn=(i,d)=>{ pos[i]=(pos[i]+d+RINGS[i].length)%RINGS[i].length; show(i); SFX.click(); };
  ringsEl.querySelectorAll(".ring").forEach(rg=>{ const i=+rg.dataset.r;
    rg.querySelector(".up").onclick=()=>turn(i,-1); rg.querySelector(".down").onclick=()=>turn(i,1);
    let y0=null; const w=rg.querySelector(".rwin");
    w.addEventListener("pointerdown",e=>{y0=e.clientY; w.setPointerCapture(e.pointerId);});
    w.addEventListener("pointermove",e=>{ if(y0==null) return; const dy=e.clientY-y0; if(Math.abs(dy)>24){ turn(i,dy<0?1:-1); y0=e.clientY; } });
    w.addEventListener("pointerup",()=>y0=null); w.addEventListener("pointercancel",()=>y0=null);
    w.style.touchAction="none"; });
  $("#open").onclick=()=>{
    const word=pos.map((p,i)=>RINGS[i][p]).join("");
    if(word===TARGET){ $("#cx").classList.add("open"); $(".phrase em").textContent="prüfe"; SFX.rumble(); fb("Der Cryptex gleitet auf …","ok");
      setTimeout(()=>solve(3,"„Claude bereitet vor – ich prüfe.“ Jedes Ergebnis wird kontrolliert, jede Note entscheidet die Lehrkraft. Dazu: Klausuren nur ohne Namen hochladen."),1200); }
    else{ SFX.err(); shake($("#cx")); fb(`„${word}“ – der Cryptex klemmt.`,"err"); }
  };
}

/* ---------- Tresor ---------- */
function vault(){
  app.innerHTML = hud() + `<section class="stage"><div class="panel glow main">
    <div class="stage-head"><div class="eyebrow">Finale · Tresor</div><h2>Tresorcode eingeben</h2></div>
    <div class="sam" id="sam" style="margin:12px 0 14px"></div>
    <div class="vault-wrap">
      <div class="vault" id="vault">
        <div class="vault-inner"><button class="key" id="keybtn" aria-label="Sammlungsschlüssel"><svg viewBox="0 0 120 120"><circle cx="38" cy="60" r="24" fill="none" stroke="#F4C95D" stroke-width="10"/><path d="M62 60h48M92 60v16M104 60v12" stroke="#F4C95D" stroke-width="10" stroke-linecap="round"/><circle cx="38" cy="60" r="6" fill="#F4C95D"/></svg></button></div>
        <div class="door"><svg viewBox="0 0 300 300" aria-hidden="true">
          <defs><radialGradient id="dg" cx="40%" cy="35%"><stop offset="0" stop-color="#5A6C9C"/><stop offset=".6" stop-color="#2A3760"/><stop offset="1" stop-color="#151D38"/></radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FA3D9"/><stop offset="1" stop-color="#27345C"/></linearGradient></defs>
          <circle cx="150" cy="150" r="146" fill="url(#rim)"/><circle cx="150" cy="150" r="132" fill="url(#dg)" stroke="#0D1426" stroke-width="3"/>
          ${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6; return `<circle cx="${150+139*Math.cos(a)}" cy="${150+139*Math.sin(a)}" r="4" fill="#0D1426"/>`}).join("")}
          <circle cx="150" cy="150" r="88" fill="none" stroke="#55D6F0" stroke-opacity=".25" stroke-width="2" stroke-dasharray="3 7"/>
          <g class="wheel"><circle cx="150" cy="150" r="22" fill="#0D1426" stroke="#8FA3D9" stroke-width="4"/>
            ${[0,120,240].map(d=>`<g transform="rotate(${d} 150 150)"><rect x="146" y="72" width="8" height="58" rx="4" fill="#8FA3D9"/><circle cx="150" cy="70" r="12" fill="#C9D4F2"/></g>`).join("")}</g>
          <text x="150" y="250" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="900" font-size="13" fill="#55D6F0" letter-spacing="3">S.A.M. SECURE</text>
          <circle cx="250" cy="70" r="7" fill="#FF5468" id="vled"/>
        </svg></div>
      </div>
      <div class="codebox">
        <div class="display" id="disp"><span class="cur"></span><span></span><span></span><span></span></div>
        <div class="pad">${["1","2","3","4","5","6","7","8","9","B","0","⌫"].map(k=>`<button class="key ${k==="B"||k==="⌫"?"alt":""}" data-k="${k}">${k}</button>`).join("")}</div>
        <div class="feedback" id="fb" aria-live="polite"></div>
      </div>
    </div></div></section>`;
  bindHud();
  typeInto($("#sam"), `<b>S.A.M.:</b> Alle 4 Systemchecks bestanden. Gebt die 4 Zeichen aus der Statusleiste in der richtigen Reihenfolge ein.`);
  let code=[];
  const upd=()=>{ $("#disp").querySelectorAll("span").forEach((s,i)=>{ s.textContent=code[i]||""; s.classList.toggle("cur", i===code.length); }); };
  app.querySelectorAll(".pad .key").forEach(k=>k.onclick=()=>{
    const v=k.dataset.k; SFX.tap();
    if(v==="⌫"){ code.pop(); upd(); return; }
    if(code.length>=4) return; code.push(v); upd();
    if(code.length===4){
      if(code.join("")===CODE.join("")){
        S.end=Date.now(); save(); $("#vled").setAttribute("fill","#5FE3A1"); fb("Code korrekt. Verriegelung wird gelöst …","ok");
        SFX.unlock(); setTimeout(()=>SFX.rumble(),500); $("#vault").classList.add("open");
        setTimeout(()=>{ S.stage=6; save(); render(); }, 3400);
      } else { SFX.err(); shake($("#disp")); fb("Falscher Code – schaut in die Statusleiste oben.","err"); setTimeout(()=>{ code=[]; upd(); },700); }
    }
  });
}

/* ---------- Sieg ---------- */
function win(){
  const t=elapsed(); const inTime=t<=TOTAL;
  app.innerHTML = hud() + `<section class="stage"><div class="panel glow main win">
    <svg viewBox="0 0 120 120" width="88" height="88" aria-hidden="true"><circle cx="38" cy="60" r="24" fill="none" stroke="#F4C95D" stroke-width="10"/><path d="M62 60h48M92 60v16M104 60v12" stroke="#F4C95D" stroke-width="10" stroke-linecap="round"/></svg>
    <div class="eyebrow" style="color:var(--green)">Lockdown aufgehoben</div>
    <h1>Sammlung entriegelt!</h1>
    <div class="stat">
      <div><b>${fmt(t).replace("+","")}</b><small>Ausbruchszeit</small></div>
      <div><b>${S.team?("Team "+S.team):"–"}</b><small>${inTime?"in der Zeit":"mit Nachspielzeit"}</small></div>
      <div><b>B138</b><small>Code = Raum der Sammlung</small></div>
    </div>
    <div class="sam" style="text-align:left;width:100%"><b>S.A.M.:</b> Und jetzt die Auflösung: Diesen Escape Room hat Claude gebaut. Story, Rätsel, Grafiken, Sounds und die Stimme stecken in einer einzigen HTML-Datei.</div>
    <div class="panel reveal" style="width:100%;background:var(--space2)">
      <div class="eyebrow">Das habt ihr gerade wiederholt</div>
      <ul>
        <li>Zu jeder Experimentierstunde: Verlaufsplan mit Materialliste, Tafelbild und Gefährdungsbeurteilung</li>
        <li>Stunden, Checkliste, Probeklausur und Apps greifen über Nummern ineinander</li>
        <li>Am Ende jeder Reihe: ein vertontes Erklärvideo mit Untertiteln</li>
        <li>Claude bereitet vor – ich prüfe und entscheide</li>
      </ul>
      <p class="muted" style="font-size:.9rem">Escape Rooms wie diesen gibt es auch für den Unterricht – z. B. „AURORA-6“ für NW 6 und „Chronoskop“ für Physik Q1.</p>
    </div>
    <button class="btn ghost" id="again">${I.restart.replace('<svg','<svg width="18" height="18" style="vertical-align:-3px;margin-right:6px"')}Neu starten</button>
  </div></section>`;
  bindHud(); confetti();
  let armed=false; $("#again").onclick=()=>{ if(!armed){ armed=true; $("#again").lastChild.textContent="Wirklich neu starten?"; return; }
    S={stage:0,team:null,start:null,solved:[],end:null}; save(); timeoutShown=false; render(); };
}
function confetti(){
  const cv=$("#confetti"); cv.hidden=false; const c=cv.getContext("2d"); const dpr=window.devicePixelRatio||1;
  const rs=()=>{ cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }; rs();
  const cols=["#55D6F0","#5FE3A1","#F4C95D","#FF9A3D","#FF5468","#EAF0FF"];
  const P=Array.from({length:160},()=>({x:Math.random()*cv.width, y:-Math.random()*cv.height*.6, vx:(Math.random()-.5)*3*dpr, vy:(2+Math.random()*3)*dpr, s:(4+Math.random()*6)*dpr, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const fr=()=>{ c.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vy+=.03*dpr; c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle=p.c; c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); c.restore(); });
    if(performance.now()-t0<6000) requestAnimationFrame(fr); else cv.hidden=true; };
  fr();
}

/* ================= Start ================= */
if(S.stage>0 && S.stage<6) startTicking();
render();
</script>
