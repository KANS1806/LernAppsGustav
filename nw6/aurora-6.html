<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURORA-6 Bodenstation</title>
<link rel="stylesheet" href="../fonts/orbitron.css">
<link rel="stylesheet" href="../fonts/atkinson-hyperlegible.css">
<link rel="stylesheet" href="../fonts/jetbrains-mono.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Layout: Bordcomputer-Konsole. Dunkler Orbit-Hintergrund, ein zentrales Panel pro Ansicht,
   Module als Karten im Raster, Rätselschritte als nacheinander aufklappende Panels.
   Einziges Thema (dunkle Konsole) – bewusst, die Seite spielt im Weltraum. */
:root{
  --space:#070B16; --space2:#0D1426; --panel:#121B33; --panel2:#182443; --line:#27345C; --line2:#3A4C7E;
  --ink:#EAF0FF; --muted:#9FAED0; --dim:#6B7AA3;
  --cyan:#55D6F0; --cyan-ink:#06212B; --cyan-soft:rgba(85,214,240,.14);
  --orange:#FF9A3D; --orange-ink:#2A1300; --orange-soft:rgba(255,154,61,.16);
  --green:#5FE3A1; --green-soft:rgba(95,227,161,.16);
  --red:#FF6B7A; --red-soft:rgba(255,107,122,.16);
  --blue:#4F7CFF;
  --font-display:"Orbitron","Segoe UI",Roboto,system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-s:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--space); color:var(--ink);
  font-family:var(--font-body); font-size:18px; line-height:1.45;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 42%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 72%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 66%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 45% 90%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 8% 50%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(ellipse at 50% -20%, #16224A 0%, transparent 60%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:16px;
  padding-block:16px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap.wide{max-width:1200px}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
button{font:inherit; color:inherit; cursor:pointer}
input{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--font-display); letter-spacing:.02em; text-wrap:balance; margin:0}
h1{font-size:clamp(1.4rem,4vw,2.1rem); font-weight:700}
h2{font-size:clamp(1.15rem,3vw,1.5rem); font-weight:700}
h3{font-size:1.05rem; font-weight:700; color:var(--cyan)}
p{margin:0}
.eyebrow{font-family:var(--font-display); font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); font-weight:500}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}

/* Kopfleiste */
.bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 16px;
}
.bar .brand{display:flex; align-items:center; gap:12px; min-width:0}
.bar .brand .logo{width:40px; height:40px; flex:none}
.bar .brand h1{font-size:1.1rem; line-height:1.2}
.bar .brand .sub{font-size:.85rem; color:var(--muted)}
.bar .stats{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line2); border-radius:999px; padding:6px 12px;
  font-family:var(--font-mono); font-size:.95rem; background:var(--space2); white-space:nowrap
}
.chip .lab{font-family:var(--font-display); font-size:.65rem; letter-spacing:.12em; color:var(--dim); text-transform:uppercase}
.chip.alert{border-color:var(--orange); color:var(--orange)}
.chip.ok{border-color:var(--green); color:var(--green)}
.chip.team{border-color:var(--cyan); color:var(--cyan)}

/* Panels */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.panel.glow{box-shadow:0 0 0 1px rgba(85,214,240,.25), 0 0 40px rgba(85,214,240,.08)}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.nova{
  font-family:var(--font-mono); font-size:1rem; line-height:1.55; background:var(--space2); border:1px solid var(--line);
  border-left:4px solid var(--cyan); border-radius:var(--r-s); padding:14px 16px; white-space:pre-wrap
}
.nova b{color:var(--cyan); font-weight:700}
.nova.mara{border-left-color:var(--orange)}
.nova.mara b{color:var(--orange)}
.cursor{display:inline-block; width:.6em; height:1.1em; background:var(--cyan); vertical-align:-.2em; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:12px 22px;
  border-radius:12px; border:2px solid var(--cyan); background:var(--cyan); color:var(--cyan-ink);
  font-family:var(--font-display); font-weight:700; font-size:1rem; letter-spacing:.04em; text-decoration:none
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{background:transparent; color:var(--cyan)}
.btn.ghost:hover{background:var(--cyan-soft)}
.btn.warn{background:var(--orange); border-color:var(--orange); color:var(--orange-ink)}
.btn.ok{background:var(--green); border-color:var(--green); color:#03301B}
.btn.quiet{background:transparent; border-color:var(--line2); color:var(--muted); font-family:var(--font-body); font-weight:400; letter-spacing:0}
.btn.quiet:hover{background:var(--panel2); color:var(--ink)}
.btn.big{min-height:64px; font-size:1.15rem; padding:16px 28px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:12px}

/* Startseite */
.hero{
  text-align:center; padding:40px 20px 32px; display:flex; flex-direction:column; align-items:center; gap:16px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(85,214,240,.12), transparent 60%),
    var(--panel);
}
.hero .logo{width:120px; height:120px}
.hero h1{font-size:clamp(1.8rem,6vw,3rem); font-weight:900; letter-spacing:.08em}
.hero .tag{color:var(--muted); font-size:1.05rem; max-width:34em}
.choose{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px}
.choice{
  text-align:left; display:flex; flex-direction:column; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:20px;
  color:var(--ink)
}
.choice:hover{border-color:var(--cyan); background:var(--panel2)}
.choice .ico{width:48px; height:48px; color:var(--cyan)}
.choice h2{font-size:1.2rem}
.choice p{color:var(--muted); font-size:.98rem}

/* Teamwahl */
.teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px}
.teambtn{
  min-height:84px; border-radius:var(--r-s); border:2px solid var(--line2); background:var(--space2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  font-family:var(--font-display); font-weight:700; font-size:1.4rem
}
.teambtn small{font-family:var(--font-body); font-weight:400; font-size:.8rem; color:var(--muted); letter-spacing:0}
.teambtn:hover{border-color:var(--cyan); color:var(--cyan)}

/* Modulraster */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.mod{
  text-align:left; display:flex; gap:14px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px;
  color:var(--ink); position:relative; min-width:0
}
.mod:hover{border-color:var(--cyan); background:var(--panel2)}
.mod .ico{width:52px; height:52px; flex:none; color:var(--cyan); background:var(--space2); border-radius:12px; padding:9px; border:1px solid var(--line)}
.mod .t{display:flex; flex-direction:column; gap:4px; min-width:0}
.mod .t .n{font-family:var(--font-display); font-size:.72rem; letter-spacing:.14em; color:var(--dim)}
.mod .t h3{color:var(--ink); font-size:1.02rem}
.mod .t .s{font-size:.9rem; color:var(--muted)}
.mod .st{position:absolute; top:12px; right:12px; font-family:var(--font-display); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; padding:4px 8px; border-radius:999px; border:1px solid var(--line2); color:var(--dim)}
.mod.done{border-color:var(--green)}
.mod.done .ico{color:var(--green); border-color:var(--green)}
.mod.done .st{border-color:var(--green); color:var(--green); background:var(--green-soft)}
.mod.next{border-color:var(--orange); box-shadow:0 0 0 1px rgba(255,154,61,.35), 0 0 26px rgba(255,154,61,.12)}
.mod.next .st{border-color:var(--orange); color:var(--orange); background:var(--orange-soft)}
.mod.open .st{border-color:var(--cyan); color:var(--cyan); background:var(--cyan-soft)}

/* Modulansicht */
.modhead{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.modhead .ico{width:64px; height:64px; color:var(--cyan); background:var(--space2); border-radius:14px; padding:11px; border:1px solid var(--line); flex:none}
.modhead .t{min-width:0}
.vorort{
  display:flex; gap:14px; align-items:flex-start; background:var(--orange-soft); border:1px solid rgba(255,154,61,.4); border-radius:var(--r-s); padding:14px 16px
}
.vorort .ico{width:40px; height:40px; color:var(--orange); flex:none}
.vorort .eyebrow{color:var(--orange)}
.steps{display:flex; flex-direction:column; gap:12px}
.step{
  background:var(--space2); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:12px
}
.step.locked{opacity:.45; filter:saturate(.3)}
.step.locked > *:not(.step-head){display:none}
.step.done{border-color:var(--green)}
.step.done > *:not(.step-head):not(.done-line){display:none}
.step-head{display:flex; align-items:center; gap:12px}
.step-head .no{
  flex:none; width:34px; height:34px; border-radius:50%; border:2px solid var(--cyan); color:var(--cyan); display:grid; place-items:center;
  font-family:var(--font-display); font-weight:700; font-size:.95rem
}
.step.done .step-head .no{border-color:var(--green); color:var(--green); background:var(--green-soft)}
.step.locked .step-head .no{border-color:var(--line2); color:var(--dim)}
.step-head h3{color:var(--ink)}
.done-line{color:var(--green); font-size:.95rem; display:flex; gap:8px; align-items:center}
.done-line .ico,.btn .ico{width:22px; height:22px; flex:none}
.nova .ico{width:20px; height:20px}
.q{font-size:1.05rem}
.opts{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{
  min-height:56px; text-align:left; padding:12px 14px; border-radius:var(--r-s); border:2px solid var(--line2); background:var(--panel);
  display:flex; gap:10px; align-items:center; font-size:1rem
}
.opt .k{flex:none; width:30px; height:30px; border-radius:8px; border:1px solid var(--line2); display:grid; place-items:center; font-family:var(--font-display); font-size:.85rem; color:var(--cyan)}
.opt:hover{border-color:var(--cyan)}
.opt.wrong{border-color:var(--red); background:var(--red-soft); animation:shake .35s}
.opt.right{border-color:var(--green); background:var(--green-soft)}
.opt.sel{border-color:var(--orange); background:var(--orange-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.inrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.inrow label{font-size:1rem; color:var(--muted)}
.field{
  display:inline-flex; align-items:center; gap:8px; background:var(--panel); border:2px solid var(--line2); border-radius:var(--r-s); padding:4px 4px 4px 14px
}
.field input{
  width:7.5em; min-height:46px; background:transparent; border:0; font-family:var(--font-mono); font-size:1.25rem; color:var(--ink); outline:none
}
.field .u{font-family:var(--font-mono); color:var(--muted); padding-right:10px}
.field.wrong{border-color:var(--red); animation:shake .35s}
.field.right{border-color:var(--green)}
.fb{min-height:1.5em; font-size:1rem}
.fb.bad{color:var(--red)}
.fb.good{color:var(--green)}
.fb.info{color:var(--orange)}
.calc{font-family:var(--font-mono); background:var(--panel); border:1px dashed var(--line2); border-radius:var(--r-s); padding:12px 14px; font-size:1.05rem}
.calc b{color:var(--orange)}
.tipp{
  background:var(--panel); border:1px solid var(--line2); border-radius:var(--r-s); padding:12px 14px; display:flex; gap:10px; align-items:flex-start; font-size:.98rem
}
.tipp .ico{width:24px; height:24px; color:var(--orange); flex:none}
.hints{display:flex; flex-direction:column; gap:10px}
.hint{background:var(--orange-soft); border:1px solid rgba(255,154,61,.4); border-radius:var(--r-s); padding:12px 14px}
.hint .eyebrow{color:var(--orange); margin-bottom:4px}

/* Freigabe */
.unlock{
  background:linear-gradient(180deg,rgba(95,227,161,.18),rgba(95,227,161,.04)); border:1px solid var(--green); border-radius:var(--r); padding:20px;
  display:flex; flex-direction:column; gap:12px; animation:pop .5s ease-out
}
@keyframes pop{0%{transform:scale(.96); opacity:0}100%{transform:scale(1); opacity:1}}
.code{
  font-family:var(--font-display); font-size:clamp(1.6rem,5vw,2.4rem); font-weight:900; letter-spacing:.14em; color:var(--green);
  background:var(--space2); border:1px dashed var(--green); border-radius:var(--r-s); padding:12px 18px; display:inline-block
}
.merke{background:var(--space2); border-left:4px solid var(--green); border-radius:var(--r-s); padding:12px 16px}
.merke .eyebrow{color:var(--green)}

/* Leitstand */
.clock{
  font-family:var(--font-display); font-weight:900; font-size:clamp(3.5rem,14vw,9rem); letter-spacing:.06em; line-height:1; text-align:center;
  color:var(--cyan); text-shadow:0 0 30px rgba(85,214,240,.35); font-variant-numeric:tabular-nums
}
.clock.warn{color:var(--orange); text-shadow:0 0 30px rgba(255,154,61,.4)}
.clock.crit{color:var(--red); text-shadow:0 0 30px rgba(255,107,122,.5); animation:blink 1s steps(1) infinite}
.phase{text-align:center; font-family:var(--font-display); font-size:clamp(1.1rem,3vw,1.6rem); letter-spacing:.08em; color:var(--ink)}
.phase small{display:block; font-family:var(--font-body); letter-spacing:0; color:var(--muted); font-size:1rem; margin-top:6px}
.progress{height:14px; background:var(--space2); border:1px solid var(--line); border-radius:999px; overflow:hidden}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--blue)); width:0%; transition:width 1s linear}
.systems{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
.sys{background:var(--space2); border:1px solid var(--line); border-radius:var(--r-s); padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.sys .ico{width:34px; height:34px; color:var(--red)}
.sys .n{font-size:.82rem; color:var(--muted)}
.sys .l{font-family:var(--font-display); font-size:.6rem; letter-spacing:.12em; color:var(--red)}
.sys.ok .ico,.sys.ok .l{color:var(--green)}
table.rot{width:100%; border-collapse:collapse; font-size:.95rem}
table.rot th,table.rot td{border:1px solid var(--line); padding:8px 6px; text-align:center}
table.rot th{font-family:var(--font-display); font-size:.7rem; letter-spacing:.1em; color:var(--muted); background:var(--space2)}
table.rot td.cur{background:var(--orange-soft); color:var(--orange); font-weight:700}
table.rot td.past{color:var(--dim)}
.tablewrap{overflow-x:auto}
.settings{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.settings label{display:flex; flex-direction:column; gap:6px; font-size:.9rem; color:var(--muted)}
.settings input{min-height:46px; background:var(--space2); border:2px solid var(--line2); border-radius:var(--r-s); padding:6px 12px; font-family:var(--font-mono); font-size:1.1rem; width:100%}
.flash{animation:flashbg 1s ease-out 3}
@keyframes flashbg{0%{box-shadow:0 0 0 0 rgba(255,154,61,.9)}100%{box-shadow:0 0 0 24px rgba(255,154,61,0)}}

/* Rätsel-Elemente */
.widget{background:var(--panel); border:1px solid var(--line2); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center}
.widget .w-title{align-self:flex-start; font-family:var(--font-display); font-size:.78rem; letter-spacing:.14em; color:var(--cyan); text-transform:uppercase}
.disc{width:min(100%,360px); max-width:100%; aspect-ratio:1; display:block}
.disc text{font-family:var(--font-mono); font-weight:700}
.cipher{font-family:var(--font-mono); font-size:1.3rem; letter-spacing:.08em; background:var(--space2); border:1px solid var(--line); border-radius:var(--r-s); padding:12px 16px; line-height:1.8; width:100%; text-align:center}
.cipher .sym{display:inline-block; min-width:1.4em; color:var(--orange); font-size:1.45rem; vertical-align:middle}
.filterbox{position:relative; width:100%; min-height:150px; background:#F3F0E8; border-radius:var(--r-s); overflow:hidden; border:1px solid var(--line)}
.filterbox .layer{position:absolute; inset:0; padding:16px 18px; font-family:var(--font-mono); font-weight:700; font-size:1.1rem; line-height:1.7; word-break:break-word}
.filterbox .layer.red{color:#D7262E}
.filterbox .layer.blue{color:#1F3BD6}
.filterbox .tint{position:absolute; inset:0; background:#E8302A; mix-blend-mode:multiply; opacity:0; pointer-events:none}
.slider{width:100%; display:flex; align-items:center; gap:12px}
.slider input[type=range]{flex:1; accent-color:var(--orange); min-height:40px}
.slider .lab{font-family:var(--font-display); font-size:.7rem; letter-spacing:.12em; color:var(--muted); white-space:nowrap}
.chart{width:100%; max-width:460px; display:block}
.chart .barbtn{cursor:pointer}
.chart .barbtn:hover rect{filter:brightness(1.2)}
.chart text{font-family:var(--font-body); fill:var(--ink)}
.chart .ax{stroke:var(--line2)}
.lockpad{display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px); gap:8px}
.lockpad button{border-radius:12px; border:2px solid var(--line2); background:var(--space2); font-size:1.6rem; color:var(--cyan)}
.lockpad button:hover{border-color:var(--cyan)}
.lockpad .c{background:var(--panel2); border-color:var(--line); font-size:1rem; color:var(--muted); font-family:var(--font-display)}
.seq{font-size:1.8rem; letter-spacing:.2em; min-height:2.4em; font-family:var(--font-mono); color:var(--orange); background:var(--space2); border:1px solid var(--line); border-radius:var(--r-s); padding:8px 16px; min-width:260px; text-align:center}
.rings{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.ring{display:flex; flex-direction:column; align-items:center; gap:4px}
.ring button{width:56px; height:40px; border-radius:8px; border:1px solid var(--line2); background:var(--space2); color:var(--cyan); font-size:1.2rem}
.ring .win{width:56px; height:120px; border:2px solid #A98A4A; border-radius:8px; background:linear-gradient(180deg,#4E3F22,#8A6B33 50%,#4E3F22); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; overflow:hidden; position:relative}
.ring .win span{display:block; height:40px; line-height:40px; color:#2C2109; opacity:.45; font-size:1rem}
.ring .win span.c{color:#FFF4D6; opacity:1; font-size:1.5rem; text-shadow:0 1px 0 #000}
.ring .win::after{content:""; position:absolute; left:0; right:0; top:40px; height:40px; border-top:2px solid rgba(255,244,214,.6); border-bottom:2px solid rgba(255,244,214,.6); pointer-events:none}

<script>
/* ========= AURORA-6 Bodenstation – Kern ========= */
(function(){
'use strict';
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) { if (k == null) continue; n.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return n;
};
const fmtClock = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), r = s%60; return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`; };
const fmtNum = x => String(x).replace('.', ',');
const parseNum = str => {
  if (str == null) return NaN;
  let s = String(str).trim().toLowerCase().replace(/\s+/g,'');
  s = s.replace(/(m²|cm²|dm²|km²|mm²|kw|kg|ml|cm|dm|km|mm|m|l|g|n|€)+$/,'');
  s = s.replace(/\./g, (m, i, all) => (all.indexOf(',') > -1 ? '' : m)); // 1.000,5 -> 1000,5
  s = s.replace(',', '.');
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let toastT;
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=> t.hidden = true, 2600); };

/* ---- Icons (inline SVG) ---- */
const I = {
  logo: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="9" fill="currentColor" fill-opacity=".15"/><rect x="4" y="27" width="16" height="10" rx="2"/><rect x="44" y="27" width="16" height="10" rx="2"/><path d="M20 32h3M41 32h3M32 23v-9M27 14h10M32 41v9"/><circle cx="32" cy="32" r="3" fill="currentColor"/></svg>`,
  lunge: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v14"/><path d="M24 20c-3 4-5 6-9 7-5 1-9 5-9 11 0 3 3 4 6 3l6-3c3-1.5 4-4 4-8z"/><path d="M24 20c3 4 5 6 9 7 5 1 9 5 9 11 0 3-3 4-6 3l-6-3c-3-1.5-4-4-4-8z"/></svg>`,
  herz: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 41S6 30 6 17a9 9 0 0 1 18-2 9 9 0 0 1 18 2c0 13-18 24-18 24z"/><path d="M10 24h7l3-5 4 10 3-6h11"/></svg>`,
  muskel: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="19" width="6" height="10" rx="1.5"/><rect x="38" y="19" width="6" height="10" rx="1.5"/><rect x="10" y="15" width="6" height="18" rx="1.5"/><rect x="32" y="15" width="6" height="18" rx="1.5"/><path d="M16 24h16"/></svg>`,
  hebel: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 30 42 18"/><path d="M24 25v15"/><path d="M14 40h20"/><rect x="34" y="11" width="8" height="7" rx="1"/><circle cx="10" cy="29" r="3"/></svg>`,
  tank: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="8" width="28" height="34" rx="6"/><path d="M10 26c5-3 9 3 14 0s9-3 14 0"/><path d="M18 8V5h12v3"/><path d="M16 34h4M28 34h4"/></svg>`,
  verdauung: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 5v9"/><path d="M22 14c-8 0-12 5-12 10s4 8 8 8h12c4 0 7 3 7 6s-3 5-7 5H14"/><path d="M14 22h10M14 28h10"/></svg>`,
  solar: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="36" height="22" rx="2"/><path d="M18 10v22M30 10v22M6 21h36"/><path d="M24 32v10M16 42h16"/></svg>`,
  kapsel: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 4c10 8 14 20 14 32v8H18v-8C18 24 22 12 32 4z"/><circle cx="32" cy="26" r="6"/><path d="M18 44 10 54h12M46 44l8 10H42"/><path d="M26 54l6 8 6-8"/></svg>`,
  tipp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5c-.8.7-1 1.5-1 2.5H9c0-1-.2-1.8-1-2.5A6 6 0 0 1 12 3z"/></svg>`,
  box: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>`,
  monitor: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="40" height="26" rx="3"/><path d="M16 42h16M24 34v8"/><path d="M12 24l6-6 6 4 8-8"/></svg>`,
  tablet: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="32" height="40" rx="4"/><path d="M20 38h8"/><path d="M16 14h16M16 22h10"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`
};
const svg = (name, cls='ico') => { const s = el('span', {class: cls}); s.innerHTML = I[name]; s.firstElementChild.setAttribute('width','100%'); s.firstElementChild.setAttribute('height','100%'); s.style.display='inline-block'; return s; };

/* ---- Sound (nur nach Klick) ---- */
let actx = null;
function ensureAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function beep(freq=880, dur=0.18, type='square', vol=0.08, when=0){
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, actx.currentTime + when);
    g.gain.linearRampToValueAtTime(vol, actx.currentTime + when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + when + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime + when); o.stop(actx.currentTime + when + dur + 0.05);
  } catch(e){}
}
const sfx = {
  ok(){ beep(660,.12,'sine',.1); beep(990,.18,'sine',.1,.12); },
  bad(){ beep(220,.25,'sawtooth',.06); },
  click(){ beep(1200,.05,'square',.03); },
  signal(){ for (let i=0;i<3;i++){ beep(880,.25,'square',.09,i*.4); beep(1320,.25,'square',.09,i*.4+.2); } },
  alarm(){ for (let i=0;i<4;i++){ beep(520,.3,'sawtooth',.07,i*.5); beep(390,.3,'sawtooth',.07,i*.5+.25); } },
  unlock(){ [523,659,784,1046].forEach((f,i)=>beep(f,.22,'sine',.1,i*.11)); }
};
function speak(text){
  try {
    if (!('speechSynthesis' in window)) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = 0.95; u.pitch = 1.0;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => /de/i.test(v.lang) && /female|anna|katja|petra|hedda|vicki|marlene/i.test(v.name)) || voices.find(v => /de/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u); return true;
  } catch(e){ return false; }
}

/* ---- Einstellungen & Rotation ---- */
const DEF = { intro: 5, runde: 7, finale: 6 };
const NMOD = 7;
function settings(){ return Object.assign({}, DEF, store.get('aurora6-settings') || {}); }
function totalSeconds(st){ return (st.intro + NMOD*st.runde + st.finale) * 60; }
/* Team t (1..7) in Runde r (1..7) -> Modulnummer */
const moduleFor = (team, round) => ((team - 1 + round - 1) % NMOD) + 1;
function phaseAt(elapsed, st){
  const intro = st.intro*60, runde = st.runde*60, fin = st.finale*60;
  if (elapsed < intro) return { kind:'intro', left: intro - elapsed, round:0 };
  const t = elapsed - intro;
  const r = Math.floor(t / runde) + 1;
  if (r <= NMOD) return { kind:'round', round:r, left: runde - (t - (r-1)*runde) };
  const f = t - NMOD*runde;
  if (f < fin) return { kind:'finale', left: fin - f, round: NMOD+1 };
  return { kind:'over', left:0, round: NMOD+2 };
}

/* ---- Story-Texte ---- */
const NOTRUF = `Hier spricht Kommandantin Mara Steen, Raumstation AURORA-6. Bodenstation, hört ihr mich?
Ein Sonnensturm hat unseren Bordcomputer NOVA getroffen. Alle sieben Systeme der Station sind gesperrt: Sauerstoff, Kühlkreislauf, Trainingsmodul, Luken-Mechanik, Wassertank, Nahrungsversorgung und Solarflügel.
NOVA hat alle Freigabecodes vergessen. Ich habe aber noch die Messdaten und Baupläne der Station. Allein schaffe ich das nicht.
Ihr seid meine Bodenstation. Rechnet, messt, untersucht. NOVA prüft jeden Code.
Ihr habt 60 Minuten. Dann ist der Sauerstoff im Kommandomodul aufgebraucht. Viel Erfolg, Bodenstation. Ende.`;

/* ========= Ansichten ========= */
const app = $('#app');
function route(){
  const h = (location.hash || '').replace('#','');
  if (h === 'leitstand') renderLeitstand();
  else if (h === 'team') renderTeam();
  else renderStart();
}
window.addEventListener('hashchange', route);
function go(h){ if (location.hash !== '#'+h) location.hash = h; else route(); }

/* ---- Startseite ---- */
function renderStart(){
  stopTimers();
  app.className = 'wrap';
  app.replaceChildren(
    el('section', {class:'panel hero glow'},
      svg('logo','logo'),
      el('div', {class:'eyebrow'}, 'Notruf aus dem Orbit'),
      el('h1', {}, 'AURORA-6 Bodenstation'),
      el('p', {class:'tag'}, 'Ein Sonnensturm hat den Bordcomputer NOVA getroffen. Sieben Systeme der Raumstation sind gesperrt. Die Bodenstation hat 60 Minuten, um sie freizuschalten.')
    ),
    el('div', {class:'choose'},
      el('button', {class:'choice', onclick:()=>go('leitstand')},
        svg('monitor','ico'), el('h2', {}, 'Leitstand'), el('p', {}, 'Für den Beamer: Notruf abspielen, großer Countdown, Wechselsignal alle 7 Minuten, Startsequenz zum Schluss.')),
      el('button', {class:'choice', onclick:()=>go('team')},
        svg('tablet','ico'), el('h2', {}, 'Teamkonsole'), el('p', {}, 'Für das Tablet eines Teams: Teamnummer wählen, sieben Module freischalten, Codes eingeben, Hinweise anfordern.'))
    ),
    el('p', {class:'muted', style:'text-align:center;font-size:.9rem'}, 'Die Seite speichert nichts auf einem Server. Der Fortschritt bleibt nur auf diesem Gerät, bis „Neue Mission“ gewählt wird.')
  );
}

/* ---- Leitstand ---- */
let timers = [];
function stopTimers(){ timers.forEach(clearInterval); timers = []; }
function renderLeitstand(){
  stopTimers();
  app.className = 'wrap wide';
  const L = store.get('aurora6-leitstand') || { startAt:null, systems:[0,0,0,0,0,0,0] };
  const st = settings();
  const save = () => store.set('aurora6-leitstand', L);

  const head = el('header', {class:'bar'},
    el('div', {class:'brand'}, svg('logo','logo'), el('div', {}, el('h1', {}, 'AURORA-6 · Leitstand'), el('div', {class:'sub'}, 'Bodenstation Essen · Bordcomputer NOVA'))),
    el('div', {class:'row'},
      el('button', {class:'btn quiet', onclick:()=>go('')}, svg('back','ico'), 'Startseite'))
  );

  if (!L.startAt){
    /* Vor dem Start: Notruf + Einstellungen */
    const novaBox = el('div', {class:'nova mara', id:'notrufText'}, '', el('span', {class:'cursor'}));
    let typing = null;
    const playNotruf = () => {
      ensureAudio(); sfx.alarm();
      clearInterval(typing);
      const cur = el('span', {class:'cursor'});
      const tn = document.createTextNode('');
      novaBox.replaceChildren(tn, cur);
      let i = 0; const txt = NOTRUF;
      const spoke = speak(txt);
      const stepMs = spoke ? 55 : 28;
      typing = setInterval(()=>{ i++; tn.nodeValue = txt.slice(0,i); if (i >= txt.length){ clearInterval(typing); cur.remove(); } }, stepMs);
    };
    const fields = el('div', {class:'settings'},
      el('label', {}, 'Notruf-Phase (Minuten)', el('input', {type:'number', min:1, max:20, value:st.intro, id:'setIntro'})),
      el('label', {}, 'Dauer pro Modul-Runde (Minuten)', el('input', {type:'number', min:3, max:15, value:st.runde, id:'setRunde'})),
      el('label', {}, 'Startsequenz (Minuten)', el('input', {type:'number', min:1, max:15, value:st.finale, id:'setFinale'}))
    );
    const total = el('p', {class:'muted'});
    const updTotal = () => { const s = readSettings(); total.textContent = `Gesamtdauer: ${s.intro} + 7 × ${s.runde} + ${s.finale} = ${s.intro + 7*s.runde + s.finale} Minuten`; };
    const readSettings = () => ({ intro: +$('#setIntro').value || DEF.intro, runde: +$('#setRunde').value || DEF.runde, finale: +$('#setFinale').value || DEF.finale });
    fields.addEventListener('input', updTotal);
    const start = () => {
      const s = readSettings(); store.set('aurora6-settings', s);
      ensureAudio(); sfx.signal();
      L.startAt = Date.now(); L.systems = [0,0,0,0,0,0,0]; save(); renderLeitstand();
    };
    app.replaceChildren(head,
      el('section', {class:'panel glow'},
        el('div', {class:'panel-head'}, el('div', {}, el('div', {class:'eyebrow'}, 'Eingehender Notruf'), el('h2', {}, 'Raumstation AURORA-6 · Kommandantin Mara Steen')),
          el('button', {class:'btn warn', onclick:playNotruf}, 'Notruf abspielen')),
        novaBox,
        el('p', {class:'muted', style:'margin-top:10px;font-size:.95rem'}, 'Der Notruf wird mit Sprachausgabe des Tablets oder Rechners vorgelesen, falls verfügbar. Sonst läuft der Text als Funkspruch durch.')
      ),
      el('section', {class:'panel'},
        el('div', {class:'panel-head'}, el('div', {}, el('div', {class:'eyebrow'}, 'Missionsplan'), el('h2', {}, 'Zeiten einstellen'))),
        fields, el('div', {style:'height:10px'}), total,
        el('p', {class:'muted', style:'margin-top:8px;font-size:.95rem'}, 'Sieben Teams, sieben Module. Team 1 beginnt bei Modul 1, Team 2 bei Modul 2 und so weiter. Nach jeder Runde wechseln alle zum nächsten Modul.')
      ),
      el('div', {class:'row end'}, el('button', {class:'btn big', onclick:start}, 'Mission starten'))
    );
    updTotal();
    return;
  }

  /* Laufende Mission */
  const clock = el('div', {class:'clock num'}, '00:00');
  const phase = el('div', {class:'phase'}, '');
  const prog = el('div', {class:'progress'}, el('i'));
  const sysNames = MODULES.map(m => m.short);
  const sysRow = el('div', {class:'systems'});
  const drawSys = () => sysRow.replaceChildren(...MODULES.map((m,i) => el('button', {class:'sys'+(L.systems[i]?' ok':''), onclick:()=>{ L.systems[i] = L.systems[i]?0:1; save(); drawSys(); if (L.systems[i]) { ensureAudio(); sfx.ok(); } }},
    svg(m.icon,'ico'), el('div', {class:'n'}, m.short), el('div', {class:'l'}, L.systems[i] ? 'Freigegeben' : 'Gesperrt'))));
  drawSys();
  const table = el('div', {class:'tablewrap'});
  const drawTable = (round) => {
    const t = el('table', {class:'rot'});
    t.append(el('thead', {}, el('tr', {}, el('th', {}, 'Team'), ...Array.from({length:NMOD},(_,r)=>el('th', {}, `Runde ${r+1}`)))));
    const tb = el('tbody');
    for (let team=1; team<=NMOD; team++){
      tb.append(el('tr', {}, el('th', {}, `Team ${team}`), ...Array.from({length:NMOD},(_,r)=>{
        const m = moduleFor(team, r+1);

      })));

  let lastPhaseKey = null;
  const finaleBtn = el('button', {class:'btn ok', onclick:()=>showFinale()}, 'Startsequenz zeigen');
  const resetBtn = el('button', {class:'btn quiet', onclick:()=>{ if (resetBtn.dataset.sure){ store.del('aurora6-leitstand'); renderLeitstand(); } else { resetBtn.dataset.sure = '1'; resetBtn.textContent = 'Wirklich zurücksetzen?'; setTimeout(()=>{ delete resetBtn.dataset.sure; resetBtn.textContent = 'Mission zurücksetzen'; }, 4000); } }}, 'Mission zurücksetzen');
  const main = el('section', {class:'panel glow', id:'leitMain'}, clock, phase, prog);

    el('section', {class:'panel'}, el('div', {class:'panel-head'}, el('div', {}, el('div', {class:'eyebrow'}, 'Systemstatus'), el('h2', {}, 'Antippen, wenn ein Team ein System freigemeldet hat'))), sysRow),
    el('section', {class:'panel'}, el('div', {class:'panel-head'}, el('div', {}, el('div', {class:'eyebrow'}, 'Rotationsplan'), el('h2', {}, 'Welches Team ist an welchem Modul?'))), table),
    el('div', {class:'row between'}, resetBtn, finaleBtn)
  );
  const tick = () => {
    const s = settings();
    const elapsed = (Date.now() - L.startAt)/1000;
    const tot = totalSeconds(s);
    const left = tot - elapsed;
    clock.textContent = fmtClock(left);
    clock.className = 'clock num' + (left < 300 ? ' crit' : (left < 900 ? ' warn' : ''));
    prog.firstChild.style.width = Math.min(100, elapsed/tot*100).toFixed(2) + '%';

    const key = p.kind + p.round;
    if (p.kind === 'intro') phase.innerHTML = `NOTRUF · BRIEFING<small>Teams wählen Teamnummer und Rollen. Runde 1 beginnt in ${fmtClock(p.left)}.</small>`;
    else if (p.kind === 'round') phase.innerHTML = `RUNDE ${p.round} VON 7<small>Wechsel in ${fmtClock(p.left)} · Team 1 ist an Modul ${moduleFor(1,p.round)}, Team 2 an Modul ${moduleFor(2,p.round)} …</small>`;
    else if (p.kind === 'finale') phase.innerHTML = `STARTSEQUENZ<small>Alle Teams melden ihre Codes. Noch ${fmtClock(p.left)} bis zum Ende der Mission.</small>`;
    else phase.innerHTML = `ZEIT ABGELAUFEN<small>Der Sauerstoff im Kommandomodul ist aufgebraucht.</small>`;
    if (key !== lastPhaseKey){

      drawTable(p.kind === 'round' ? p.round : (p.kind === 'intro' ? 0 : 99));

  function showFinale(){

    app.replaceChildren(head,
      el('section', {class:'final'},
        svg('kapsel','capsule'),

        el('h1', {}, 'Alle Systeme wiederhergestellt'),
        el('p', {class:'tag', style:'color:var(--muted);max-width:40em'}, 'Sauerstoff, Kühlkreislauf, Trainingsmodul, Luken-Mechanik, Wassertank, Nahrungsversorgung und Solarflügel laufen wieder. Kommandantin Steen startet die Rückkehrkapsel. Danke, Bodenstation Essen.'),
        el('div', {class:'nova mara', style:'text-align:left;max-width:40em'}, 'Bodenstation, hier Mara Steen. Ich sehe sieben grüne Lampen. Ihr habt gemessen, gerechnet und nicht aufgegeben. Ich komme nach Hause. Ende.'),
        el('div', {class:'row'}, el('button', {class:'btn ghost', onclick:()=>renderLeitstand()}, 'Zurück zum Leitstand'))
      )
    );
  }
}

  app.replaceChildren(teamBar(),

/* ---- Modulansicht & Schritt-Engine ---- */
function renderModule(n){
  stopTimers();
  const m = MODULES[n-1];
  const isDone = !!T.done[n];
  const back = el('button', {class:'btn quiet', onclick:()=>{ T.open = null; saveTeam(); renderTeam(); }}, svg('back','ico'), 'Alle Module');
  const head = el('section', {class:'panel glow'},
    el('div', {class:'modhead'}, svg(m.icon,'ico'), el('div', {class:'t'}, el('div', {class:'eyebrow'}, `Modul ${n} · ${m.system}`), el('h2', {}, m.name))),
    el('div', {style:'height:12px'}),
    el('div', {class:'nova mara'}, el('b', {}, 'Mara Steen: '), m.story),
    el('div', {style:'height:12px'}),
    el('div', {class:'vorort'}, svg('box','ico'), el('div', {}, el('div', {class:'eyebrow'}, 'Vor Ort an der Station'), el('div', {}, m.vorOrt)))
  );
  const stepsBox = el('section', {class:'steps'});
  const hintBox = el('section', {class:'panel'}, el('div', {class:'panel-head'}, el('div', {}, el('div', {class:'eyebrow'}, 'Funkkanal'), el('h2', {}, 'Hinweise von NOVA'))));
  const hintsList = el('div', {class:'hints'});
  const usedHints = T.hints[n] || 0;
  const costs = [5,10,15];
  const hintBtn = el('button', {class:'btn ghost', onclick:()=>{
    const k = T.hints[n] || 0; if (k >= m.hints.length) return;
    T.hints[n] = k+1; T.energy = Math.max(0, T.energy - costs[k]); saveTeam(); ensureAudio(); sfx.click();
    drawHints(); const chip = $('#chipEnergy'); if (chip){ chip.lastChild.nodeValue = `${T.energy} %`; chip.classList.toggle('alert', T.energy<40); }
  }}, '');
  const drawHints = () => {
    const k = T.hints[n] || 0;
    hintsList.replaceChildren(...m.hints.slice(0,k).map((h,i)=>el('div', {class:'hint'}, el('div', {class:'eyebrow'}, `Hinweis ${i+1}`), h)));
    if (k >= m.hints.length){ hintBtn.disabled = true; hintBtn.textContent = 'Keine weiteren Hinweise'; }
    else hintBtn.textContent = `Hinweis ${k+1} anfordern (−${costs[k]} % Energie)`;
  };
  drawHints();
  hintBox.append(hintsList, el('div', {style:'height:10px'}), hintBtn);
  app.replaceChildren(teamBar(), head, stepsBox, isDone ? null : hintBox, el('div', {class:'row'}, back));

  if (isDone){ stepsBox.append(unlockPanel(n, m)); return; }

  /* Schritte nacheinander */
  const steps = m.steps.map((s, i) => {
    const box = el('div', {class:'step locked'}, el('div', {class:'step-head'}, el('div', {class:'no'}, String(i+1)), el('h3', {}, s.title)));
    return { def:s, box, state:'locked' };
  });
  const activate = (i) => {
    const st = steps[i]; st.state = 'active'; st.box.className = 'step';
    const body = el('div', {class:'stack'});
    st.box.append(body);
    const api = {
      done(summary){
        if (st.state === 'done') return;
        st.state = 'done'; st.box.className = 'step done';
        st.box.append(el('div', {class:'done-line'}, svg('check','ico'), summary || 'Erledigt'));
        ensureAudio(); sfx.ok();
        if (i+1 < steps.length) { activate(i+1); steps[i+1].box.scrollIntoView({behavior:'smooth', block:'center'}); }
        else finish();
      },
      fail(){ T.attempts++; saveTeam(); ensureAudio(); sfx.bad(); }
    };
    st.def.render(body, api);
    stepsBox.append(...steps.map(s=>s.box));
  };
  const finish = () => {
    T.done[n] = true; T.open = n; saveTeam(); ensureAudio(); sfx.unlock();
    const u = unlockPanel(n, m); stepsBox.append(u); u.scrollIntoView({behavior:'smooth', block:'center'});
    hintBox.remove();
    const sub = $('.bar .sub'); if (sub) sub.textContent = `${Object.keys(T.done).length} von 7 Systemen freigegeben`;
  };
  stepsBox.append(...steps.map(s=>s.box));
  activate(0);
}
function unlockPanel(n, m){
  const allDone = Object.keys(T.done).length === NMOD;
  return el('div', {class:'unlock'},
    el('div', {class:'eyebrow', style:'color:var(--green)'}, `System freigegeben · Modul ${n}`),
    el('h2', {}, m.name + ' läuft wieder'),
    el('div', {}, el('span', {class:'code'}, m.code)),
    el('p', {}, 'Schreibt den Freigabecode in euer Logbuch und meldet ihn beim Leitstand.'),
    el('div', {class:'merke'}, el('div', {class:'eyebrow'}, 'Das steckt dahinter'), m.merke),
    el('div', {class:'row'}, el('button', {class:'btn ok', onclick:()=>{ T.open = null; saveTeam(); renderTeam(); }}, allDone ? 'Zur Abschlussmeldung' : 'Weiter zum nächsten Modul'))
  );
}

/* ---- Schritt-Bausteine ---- */
/* Multiple Choice: options = [{t:'Text', ok:true, note:'Zusatz nach richtiger Wahl'}] */
function mc(title, question, options, opts={}){
  return { title, render(box, api){
    box.append(el('p', {class:'q'}, question));
    const fb = el('div', {class:'fb'});
    const grid = el('div', {class:'opts'});
    options.forEach((o, i) => {
      const b = el('button', {class:'opt'}, el('span', {class:'k'}, 'ABCDEF'[i]), o.t);
      b.addEventListener('click', ()=>{
        if (o.ok){ grid.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add('right'); fb.className='fb good'; fb.textContent = o.note || 'Richtig.'; api.done(opts.summary || o.t); }
        else { b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'), 500); fb.className='fb bad'; fb.textContent = o.fb || 'Das passt nicht. Schaut noch einmal genau hin.'; api.fail(); }
      });
      grid.append(b);
    });
    box.append(grid, fb);
    if (opts.tipp) box.append(el('div', {class:'tipp'}, svg('tipp','ico'), el('div', {}, opts.tipp)));
  }};
}
/* Zahleneingabe: fields = [{label, unit, answer, tol, min, max, id}] */
function num(title, question, fields, opts={}){
  return { title, render(box, api){
    if (question) box.append(el('p', {class:'q', html: question}));
    if (opts.calc) box.append(el('div', {class:'calc', html: opts.calc}));
    const rows = fields.map(f => {
      const inp = el('input', {type:'text', inputmode:'decimal', autocomplete:'off', id:f.id || ('f_'+Math.random().toString(36).slice(2,8)), placeholder:'…'});
      const field = el('div', {class:'field'}, inp, f.unit ? el('span', {class:'u'}, f.unit) : null);
      return { f, inp, field, row: el('div', {class:'inrow'}, f.label ? el('label', {for:inp.id}, f.label) : null, field) };
    });
    const fb = el('div', {class:'fb'});
    let tries = 0;
    const check = () => {
      let allOk = true, anyEmpty = false;
      rows.forEach(r => {
        const v = parseNum(r.inp.value);
        if (r.inp.value.trim() === '') { anyEmpty = true; }
        let ok;
        if (r.f.min != null) ok = !isNaN(v) && v >= r.f.min && v <= r.f.max;
        else ok = !isNaN(v) && Math.abs(v - r.f.answer) <= (r.f.tol ?? 0.001);
        r.field.classList.toggle('wrong', !ok); r.field.classList.toggle('right', ok);
        if (!ok) allOk = false;
      });
      if (anyEmpty && !allOk){ fb.className='fb info'; fb.textContent = 'Bitte alle Felder ausfüllen.'; return; }
      if (allOk){ fb.className='fb good'; fb.textContent = opts.good || 'NOVA bestätigt: passt.'; rows.forEach(r=>r.inp.disabled=true); btn.disabled = true;
        api.done(opts.summary ? opts.summary(rows.map(r=>r.inp.value)) : rows.map(r=> (r.f.label? r.f.label+' ' : '') + r.inp.value + (r.f.unit? ' '+r.f.unit:'')).join(' · ')); }
      else { tries++; api.fail(); fb.className='fb bad'; fb.textContent = tries >= 2 && opts.tipp2 ? opts.tipp2 : (opts.bad || 'NOVA lehnt ab. Rechnet noch einmal nach und prüft das Komma.'); }
    };
    const btn = el('button', {class:'btn', onclick:check}, 'Prüfen');
    rows.forEach(r => r.inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }));
    box.append(...rows.map(r=>r.row), el('div', {class:'row'}, btn), fb);
    if (opts.tipp) box.append(el('div', {class:'tipp'}, svg('tipp','ico'), el('div', {html: opts.tipp})));
  }};
}
/* Eigenes Element */
function custom(title, render){ return { title, render }; }

window.A6 = { el, svg, mc, num, custom, parseNum, fmtNum, sfx, ensureAudio, toast, I };
window.A6.boot = () => { route(); };
})();
</script>
<script>
/* ========= AURORA-6 – Die sieben Module ========= */
(function(){

const { el, svg, mc, num, custom, parseNum, fmtNum, sfx, ensureAudio } = window.A6;
const svgNS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs={}, ...kids) => { const n = document.createElementNS(svgNS, tag); for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, v); kids.forEach(k => n.append(k.nodeType ? k : document.createTextNode(String(k)))); return n; };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fbEl = () => el('div', {class:'fb'});
const setFb = (fb, cls, txt) => { fb.className = 'fb ' + cls; fb.textContent = txt; };

/* ---------- Widget: Drehscheibe ---------- */
const SYM = ['◆','●','▲','■','✶','⬢','◐','✚','⌂','≋'];
const LET = 'ABCDEFGHIJ';
const KEY = 3; // richtige Einstellung: D
const enc = d => SYM[(d + KEY) % 10];
function drehscheibe(){
  const wrap = el('div', {class:'widget'});
  let k = 0;
  const sv = S('svg', {viewBox:'0 0 340 340', class:'disc', role:'img', 'aria-label':'Drehscheibe'});
  const defs = S('defs');
  defs.innerHTML = `<radialGradient id="dg1" cx="50%" cy="40%"><stop offset="0" stop-color="#2A3B6E"/><stop offset="1" stop-color="#121B33"/></radialGradient><radialGradient id="dg2" cx="50%" cy="40%"><stop offset="0" stop-color="#1B2A52"/><stop offset="1" stop-color="#0D1426"/></radialGradient>`;
  sv.append(defs);
  sv.append(S('circle', {cx:170, cy:170, r:160, fill:'url(#dg1)', stroke:'#55D6F0', 'stroke-width':2}));
  // Außenring: Symbole
  for (let j=0;j<10;j++){
    const a = (j*36 - 90) * Math.PI/180;
    const x = 170 + Math.cos(a)*138, y = 170 + Math.sin(a)*138;
    sv.append(S('text', {x, y:y+7, 'text-anchor':'middle', 'font-size':24, fill:'#FF9A3D'}, SYM[j]));
    const a2 = ((j*36)+18-90)*Math.PI/180;
    sv.append(S('line', {x1:170+Math.cos(a2)*118, y1:170+Math.sin(a2)*118, x2:170+Math.cos(a2)*158, y2:170+Math.sin(a2)*158, stroke:'#27345C'}));

/* ---------- Widget: Cryptex ---------- */
function cryptex(word, onOpen){
  const wrap = el('div', {class:'widget'});
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const pos = word.split('').map(()=>0);
  const rings = el('div', {class:'rings'});
  const fb = fbEl();
  const wins = [];
  word.split('').forEach((_, i) => {
    const win = el('div', {class:'win', 'aria-live':'polite'});
    wins.push(win);
    const up = el('button', {'aria-label':`Ring ${i+1} hoch`, onclick:()=>{ pos[i] = (pos[i]+25)%26; draw(); sfx.click(); }}, '▲');
    const dn = el('button', {'aria-label':`Ring ${i+1} runter`, onclick:()=>{ pos[i] = (pos[i]+1)%26; draw(); sfx.click(); }}, '▼');
    rings.append(el('div', {class:'ring'}, up, win, dn));
  });
  const draw = () => wins.forEach((w,i) => { const p = pos[i]; w.replaceChildren(el('span', {}, ALPHA[(p+25)%26]), el('span', {class:'c'}, ALPHA[p]), el('span', {}, ALPHA[(p+1)%26])); });
  draw();
  const open = el('button', {class:'btn', onclick:()=>{
    const w = pos.map(p=>ALPHA[p]).join('');
    if (w === word){ setFb(fb,'good','Der Riegel fährt zurück. Das Cryptex ist offen.'); open.disabled = true; rings.querySelectorAll('button').forEach(b=>b.disabled=true); onOpen(); }
    else { setFb(fb,'bad','Der Riegel klemmt. Sucht die Knochen mit den Nummern des Knochen-Codes und lest die Anfangsbuchstaben ab.'); sfx.bad(); }
  }}, 'Cryptex öffnen');
  wrap.append(el('div', {class:'w-title'}, 'Cryptex · Vier Ringe, ein Wort'), rings, el('div', {class:'row'}, open), fb);
  return wrap;
}

/* ---------- Widget: Lochschablone ---------- */
function lochschablone(onRead){
  const cols = 12, rows = 5, correct = 2;
  const hint = 'ZERLEGEDIEFIGURINRECHTECKE'; // 26 Buchstaben, ein Wort pro Zeile
  // Löcher in Schablonen-Koordinaten (Zeile, Spalte 0..9); bei Stellung 2 liegen sie in den Rasterspalten 2..11
  const holes = [];
  [[0,1,7],[1,4,3],[2,2,5],[3,6,2],[4,0,9]].forEach(([r,c0,len]) => { for (let c=c0; c<c0+len; c++) holes.push([r,c]); });
  const letters = Array.from({length:rows},()=>Array.from({length:cols},()=>'ABDEFGHIKLMNOPRSTUWZ'[Math.floor(Math.random()*20)]));
  holes.forEach(([r,c],i) => { letters[r][c + correct] = hint[i]; });
  const g = el('div', {class:'g', style:`--cols:${cols};padding:0`});
  letters.forEach(row => row.forEach(ch => g.append(el('span', {}, ch))));
  const mask = el('div', {class:'mask', style:`--cols:${cols};padding:0;grid-template-columns:repeat(${cols+4},1fr);width:${(cols+4)/cols*100}%;left:${-2/cols*100}%`});
  for (let r=0;r<rows;r++) for (let c=0;c<cols+4;c++){ const isHole = holes.some(h=>h[0]===r && h[1]===c-2); mask.append(el('span', {class: isHole?'hole':''})); }
  const box = el('div', {class:'grille', style:`--cols:${cols}`}, g, mask);
  const range = el('input', {type:'range', min:0, max:4, value:0, id:'grilleRange', 'aria-label':'Schablone verschieben'});
  const apply = () => { const cell = box.clientWidth / cols; mask.style.transform = `translateX(${(range.value - 0) * cell}px)`; };
  range.addEventListener('input', apply);
  const ro = new ResizeObserver(apply); ro.observe(box);
  const fb = fbEl();
  const inp = el('input', {type:'text', id:'grilleWord', autocomplete:'off', placeholder:'letztes Wort'});
  const check = () => {
    const v = inp.value.trim().toLowerCase().replace(/[^a-zäöü]/g,'');
    if (v === 'rechtecke' || v === 'rechteck'){ setFb(fb,'good','Genau. Der Tipp lautet: Zerlege die Figur in Rechtecke.'); inp.disabled = true; onRead(); }
    else { setFb(fb,'bad','Verschiebt die Schablone, bis in den Löchern Wörter erscheinen. Lest zeilenweise.'); sfx.bad(); }
  };
  inp.addEventListener('keydown', e=>{ if (e.key==='Enter') check(); });
  const wrap = el('div', {class:'widget'}, el('div', {class:'w-title'}, 'Lochschablone · Verschieben, bis der Tipp lesbar ist'), box,
    el('div', {class:'slider'}, el('span', {class:'lab'}, 'links'), range, el('span', {class:'lab'}, 'rechts')),
    el('div', {class:'inrow'}, el('label', {for:'grilleWord'}, 'Wie heißt das letzte Wort des Tipps?'), el('div', {class:'field'}, inp)),
    el('div', {class:'row'}, el('button', {class:'btn', onclick:check}, 'Prüfen')), fb);
  setTimeout(apply, 50);
  return wrap;
}

/* ---------- Widget: Flächenpuzzle (Zottenwand) ---------- */
function zottenwand(onAllMarked){
  const wrap = el('div', {class:'widget'});
  const u = 52; // px pro Meter
  const W = 6, H0 = 2, fw = 1, fh = 4, gap = 0.4;
  const sv = S('svg', {viewBox:`-40 -20 ${W*u+90} ${(H0+fh)*u+60}`, class:'figure', role:'img', 'aria-label':'Zottenwand'});
  const regs = [];
  const mk = (x,y,w,h,label) => { const r = S('rect', {x:x*u, y:y*u, width:w*u, height:h*u, class:'reg', tabindex:0, role:'button', 'aria-label':label}); regs.push(r); return r; };
  const top = (H0+fh); // y der Basis-Oberkante im umgedrehten Koordinatensystem: wir zeichnen Zotten oben, Basis unten
  sv.append(mk(0, fh, W, H0, 'Grundstreifen'));
  for (let i=0;i<4;i++){ const x = gap + i*(fw+gap); sv.append(mk(x, 0, fw, fh, `Zotte ${i+1}`)); }
  // Maße
  sv.append(S('text', {x:W*u/2, y:(fh+H0)*u+28, 'text-anchor':'middle', class:'dim'}, '6 m'));
  sv.append(S('text', {x:W*u+12, y:(fh+H0/2)*u+5, class:'dim'}, '2 m'));
  sv.append(S('text', {x:-10, y:fh*u/2+5, 'text-anchor':'end', class:'dim'}, '4 m'));
  sv.append(S('text', {x:(gap+fw/2)*u, y:-6, 'text-anchor':'middle', class:'dim'}, '1 m'));
  sv.append(S('line', {x1:(gap)*u, x2:(gap+fw)*u, y1:-2, y2:-2, stroke:'#FF9A3D', 'stroke-width':2}));
  let on = 0;
  regs.forEach(r => { const t = () => { if (r.classList.contains('on')) return; r.classList.add('on'); on++; sfx.click(); if (on === regs.length) onAllMarked(); }; r.addEventListener('click', t); r.addEventListener('keydown', e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); t(); } }); });
  wrap.append(el('div', {class:'w-title'}, 'Zottenwand · Tippt jedes Rechteck an, in das sich die Figur zerlegen lässt'), sv,
    el('p', {class:'muted', style:'font-size:.95rem;text-align:center'}, 'Unten der Grundstreifen der Darmwand, oben vier Zotten. Alle Maße in Metern (Modell).'));
  return wrap;
}

/* ---------- Widget: Tresor-Drehrad ---------- */
function tresor(values, targets, onOpen){
  const wrap = el('div', {class:'widget'});
  let k = 0; const picked = [];
  const n = values.length;
  const sv = S('svg', {viewBox:'0 0 300 300', class:'dial', role:'img', 'aria-label':'Tresor-Drehrad'});
  sv.append(S('circle', {cx:150, cy:150, r:140, fill:'#121B33', stroke:'#A98A4A', 'stroke-width':6}));
  const g = S('g', {style:'transition:transform .3s; transform-origin:150px 150px'});
  g.append(S('circle', {cx:150, cy:150, r:118, fill:'#0D1426', stroke:'#3A4C7E', 'stroke-width':2}));
  values.forEach((v,i) => { const a = (i*360/n - 90)*Math.PI/180; const t = S('text', {x:150+Math.cos(a)*95, y:150+Math.sin(a)*95+6, 'text-anchor':'middle', 'font-size':18, fill:'#EAF0FF'}, fmtNum(v)); t.setAttribute('transform', `rotate(${-0} ${150+Math.cos(a)*95} ${150+Math.sin(a)*95})`); g.append(t); });
  g.append(S('circle', {cx:150, cy:150, r:38, fill:'#070B16', stroke:'#A98A4A', 'stroke-width':3}));
  sv.append(g);
  sv.append(S('path', {d:'M150 6 L140 24 L160 24 Z', fill:'#FF9A3D'}));
  const cur = el('div', {class:'chip'}, el('span', {class:'lab'}, 'Am Zeiger'), el('b', {}, fmtNum(values[0])));
  const slots = el('div', {class:'slots'}, ...targets.map((_,i)=>el('div', {class:'slot'+(i===0?' cur':'')}, `Zahl ${i+1}`)));
  const fb = fbEl();
  const upd = () => { g.style.transform = `rotate(${-k*360/n}deg)`; g.querySelectorAll('text').forEach((t,i)=>{ const a=(i*360/n-90)*Math.PI/180; t.setAttribute('transform', `rotate(${k*360/n} ${150+Math.cos(a)*95} ${150+Math.sin(a)*95})`); }); cur.lastChild.textContent = fmtNum(values[k]); };
  const rot = d => { k = (k + d + n) % n; upd(); sfx.click(); };
  const einrasten = el('button', {class:'btn', onclick:()=>{
    const i = picked.length; if (i >= targets.length) return;
    if (Math.abs(values[k] - targets[i]) < 1e-9){ picked.push(values[k]); const s = slots.children[i]; s.textContent = fmtNum(values[k]); s.className = 'slot ok'; if (slots.children[i+1]) slots.children[i+1].className = 'slot cur'; sfx.ok();
      if (picked.length === targets.length){ setFb(fb,'good','Alle drei Zahlen eingerastet. Der Tresor öffnet sich.'); einrasten.disabled = true; onOpen(); } else setFb(fb,'good',`Zahl ${i+1} eingerastet.`); }
    else { setFb(fb,'bad',`Zahl ${i+1} passt nicht. Macht einen Überschlag: Ist das Ergebnis ungefähr so groß?`); sfx.bad(); }
  }}, 'Einrasten');
  wrap.append(el('div', {class:'w-title'}, 'Tresor-Drehrad · Drei Zahlen nacheinander eindrehen'), sv,
    el('div', {class:'row'}, el('button', {class:'btn ghost', onclick:()=>rot(-1), 'aria-label':'links drehen'}, '◄'), cur, el('button', {class:'btn ghost', onclick:()=>rot(1), 'aria-label':'rechts drehen'}, '►')),
    slots, el('div', {class:'row'}, einrasten), fb);
  upd();
  return wrap;
}

        [m,v1,v2,vol].forEach(x=>x.i.disabled=true); btn.disabled = true;
        const sinkt = M > V;
        pick.replaceChildren(
          el('p', {class:'q', style:'grid-column:1/-1'}, `Euer Körper hat ${fmtNum(M)} g und ${fmtNum(V)} ml. Hat er mehr Gramm als Milliliter, ist er dichter als Wasser. Was passiert, wenn ihr ihn ins Wasser legt?`),
          el('button', {class:'opt', onclick:(e)=>{ if (sinkt){ e.currentTarget.classList.add('right'); api.done(`Masse ${fmtNum(M)} g, Volumen ${fmtNum(V)} ml, dichter als Wasser → sinkt`); } else { e.currentTarget.classList.add('wrong'); setFb(fb,'bad','Vergleicht noch einmal: Gramm und Milliliter.'); api.fail(); } }}, el('span', {class:'k'}, 'A'), 'Er sinkt.'),
          el('button', {class:'opt', onclick:(e)=>{ if (!sinkt){ e.currentTarget.classList.add('right'); api.done(`Masse ${fmtNum(M)} g, Volumen ${fmtNum(V)} ml, weniger dicht als Wasser → schwimmt`); } else { e.currentTarget.classList.add('wrong'); setFb(fb,'bad','Vergleicht noch einmal: Gramm und Milliliter.'); api.fail(); } }}, el('span', {class:'k'}, 'B'), 'Er schwimmt.')

      };

      box.append(el('div', {class:'inrow'}, el('label', {for:'m5_masse'}, 'Masse'), m.f), el('div', {class:'inrow'}, el('label', {for:'m5_v1'}, 'Wasserstand vorher'), v1.f), el('div', {class:'inrow'}, el('label', {for:'m5_v2'}, 'Wasserstand nachher'), v2.f), el('div', {class:'inrow'}, el('label', {for:'m5_vol'}, 'Volumen des Körpers'), vol.f), el('div', {class:'row'}, btn), fb, pick);
    }),
    num('Tankdeckel berechnen', 'Der Tankdeckel ist ein Rechteck: 1,2 m lang und 0,8 m breit (siehe Protokoll).', [
      {label:'Umfang des Tankdeckels', unit:'m', answer:4, id:'m5_u'},
