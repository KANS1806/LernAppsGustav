<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../fonts/carlito.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Layout: eine Bildschirmseite wie die Jg.-6-Apps – Reiter oben, darunter eine Aufgabe pro Seite, unten Zurück/Weiter. Farben und Schrift im EF-Hausstil (navy + Akzent). */
:root{--bg:#F6F7FB;--card:#FFFFFF;--text:#26314A;--navy:#1E2761;--band:#1E2761;--band-ink:#FFFFFF;--band-sub:#CADCFC;
--primary:#1E2761;--on-primary:#FFFFFF;--acc:#B85042;--cream:#F3EAD9;--cream-line:#E5D6B8;--light:#EDEFF7;
--grey:#626B7E;--line:#C9CEDA;--grid:#E5E7EB;--cmp:#9CA3AF;--ok:#2F7D4F;--okbg:#E7F3EC;--warn:#9A6600;--warnbg:#FFF1CC;--bad:#B3261E;--badbg:#FBEAEA;
--scrim:rgba(14,19,40,.5);--c3:#2F7D4F;--c4:#7C3AED;
--f-head:Cambria,Caladea,Georgia,serif;--f-body:Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1326;--card:#181D38;--text:#E4E7F2;--navy:#C9D3FF;--band:#1A2147;
--band-ink:#FFFFFF;--band-sub:#B8C6F5;--primary:#8FA2FF;--on-primary:#0F1326;--acc:#E59484;--cream:#2B2618;--cream-line:#5A4D2E;--light:#232A4D;
--grey:#9AA3B8;--line:#3A4266;--grid:#283052;--cmp:#6B7280;--ok:#6FCF97;--okbg:#16321F;--warn:#F2C14E;--warnbg:#3B3116;--bad:#F28B82;--badbg:#3A1C1C;
--scrim:rgba(0,0,0,.6);--c3:#6FCF97;--c4:#B69CFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1326;--card:#181D38;--text:#E4E7F2;--navy:#C9D3FF;--band:#1A2147;
--band-ink:#FFFFFF;--band-sub:#B8C6F5;--primary:#8FA2FF;--on-primary:#0F1326;--acc:#E59484;--cream:#2B2618;--cream-line:#5A4D2E;--light:#232A4D;
--grey:#9AA3B8;--line:#3A4266;--grid:#283052;--cmp:#6B7280;--ok:#6FCF97;--okbg:#16321F;--warn:#F2C14E;--warnbg:#3B3116;--bad:#F28B82;--badbg:#3A1C1C;
--scrim:rgba(0,0,0,.6);--c3:#6FCF97;--c4:#B69CFF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 var(--f-body);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column}
.inner{max-width:1180px;margin:0 auto;width:100%}

/* Kopf */
.top{background:var(--band);color:var(--band-ink);padding-block:8px}
.top .inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
.top .k{color:var(--band-sub);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.top h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance}
.top .pts{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.top .merkbtn{background:transparent;color:var(--band-ink);border:2px solid var(--band-sub);border-radius:999px;padding:4px 16px;min-height:40px;margin:0}

/* Reiter */
.tabs{padding-block:8px 2px}
.tabs .inner{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.tab{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:5px 11px;display:flex;flex-direction:column;gap:0;min-height:50px;min-width:0}
.tab:hover{border-color:var(--navy)}
.tab:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tab[aria-current="true"]{border-color:var(--navy);background:var(--light)}
.tab .tl{display:flex;justify-content:space-between;gap:6px;min-width:0}
.tab .tl .lvl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab .lvl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
.tab b{font-family:var(--f-head);color:var(--navy);font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab small{color:var(--grey);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab.fertig small{color:var(--ok);font-weight:700}

.progress{display:flex;gap:6px;padding-block:4px 0}
.pd{all:unset;cursor:pointer;flex:1;height:20px;display:flex;align-items:center}
.pd::before{content:"";display:block;width:100%;height:9px;border-radius:5px;background:var(--line)}
.pd.inf::before{background:var(--light);box-shadow:inset 0 0 0 1.5px var(--line)}
.pd.good::before{background:var(--ok)} .pd.ok::before{background:var(--warn)}
.pd.cur::before{background:var(--navy);height:11px}
.pd.cur.good::before,.pd.cur.ok::before{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--navy)}
.pd:focus-visible{outline:3px solid var(--acc);outline-offset:1px;border-radius:4px}

/* Bühne */
.stage{flex:1;min-height:0;overflow:auto;padding-block:6px}
.screen{max-width:1180px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px 12px}
.chead{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;margin-bottom:6px}
.card .lab{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.card.done .lab::after{content:"  ·  erledigt ✓";color:var(--ok)}
.card h3{margin:0;color:var(--navy);font:700 21px/1.25 var(--f-head);text-wrap:balance}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.viz,.qs{min-width:0}
.intro{margin:0 0 6px}
.qs .intro{font-size:16px}
.graph{width:100%;height:auto;max-height:calc(100dvh - 440px);min-height:170px;display:block;margin:0 auto;background:var(--card);border-radius:8px}
.mini{width:100%;max-width:240px;display:block;margin:0 auto}
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px;margin:6px 0 0}
.sl{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:10px;align-items:center}
.sl .pn{font:italic 700 20px var(--f-head);color:var(--navy)}
.sl input[type=range]{width:100%;accent-color:var(--acc);height:30px;margin:0}
.sl .pv{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.vizfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vizfoot button{margin:4px 0 0;min-height:38px;padding:4px 12px;font-size:15px}

.qhead{display:flex;align-items:center;gap:10px;border-top:2px dashed var(--line);padding-top:8px;margin-top:2px}
.qhead .small{font-weight:700;color:var(--navy)}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qd{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--light);color:var(--navy);border:2px solid var(--line);box-sizing:border-box}
.qd.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.qd.cur{border-color:var(--navy)}
.qd:focus-visible{outline:3px solid var(--acc)}
.qq{margin-top:8px}
.qq .qt{font-size:18px;margin-bottom:4px}
.qnav{display:flex;gap:6px;margin-left:auto}
.qnav button{margin:0;min-height:36px;padding:2px 12px;font-size:15px}
.qhead{flex-wrap:wrap}
.alldone{margin-top:10px}

button{font:inherit;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);padding:8px 16px;margin:6px 8px 0 0;cursor:pointer;min-height:44px}
button.sec{background:var(--card);color:var(--navy);border-color:var(--navy)}
button.ghost{background:var(--card);color:var(--acc);border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text]{font:inherit;padding:6px 10px;border:1.5px dashed var(--acc);border-radius:8px;width:8em;min-height:44px;background:var(--card);color:var(--text)}
input[type=text].ok{border:2px solid var(--ok);background:var(--okbg)}
input[type=text].bad{border:2px solid var(--bad);background:var(--badbg)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.row .l{font-weight:700;color:var(--navy);min-width:9.5em}
.fields{display:grid;grid-template-columns:repeat(2,max-content);gap:0 26px}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok);font-weight:700}
.fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.hint{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--cream);border:1px solid var(--cream-line)}
.sol{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--light);border-left:5px solid var(--navy)}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;margin:5px 0;cursor:pointer;background:var(--card);min-height:44px}
.opt.sel{border-color:var(--navy);background:var(--light)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .box{width:20px;height:20px;border:2px solid var(--navy);border-radius:5px;flex:none}
.opt.sel .box{background:var(--navy)}
.zu{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.tilegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);position:relative}
.tile b{position:absolute;left:8px;top:4px;color:var(--acc);font:700 20px var(--f-head)}
.tile .mini{max-height:calc((100dvh - 330px) / 2)}
.tile.txt{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px}
.zu.txtmode{grid-template-columns:minmax(0,1fr);gap:8px}
.zu.txtmode .tilegrid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.zu.txtmode .zlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 24px;align-items:start}
.zu.txtmode .zlist>button,.zu.txtmode .zlist>.fb{grid-column:1/-1;justify-self:start}
.tile.txt b{position:static;flex:none}
.tile.txt span{font-size:17px}
.steps .s{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:5px 0;background:var(--card);cursor:pointer;min-height:44px}
.steps .s.used{opacity:.35;cursor:default}
.steps .o{border:1.5px solid var(--navy);background:var(--light);border-radius:8px;padding:8px 12px;margin:5px 0;display:flex;gap:10px}
.steps .o.ok{border-color:var(--ok);background:var(--okbg)} .steps .o.bad{border-color:var(--bad);background:var(--badbg)}
.steps .n{font-weight:700;color:var(--navy);min-width:22px}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.75em;line-height:1}
.ss sup,.ss sub{position:static;font-size:1em}
.rt .rti{border-top:1.3px solid currentColor;padding:0 .1em}
.zrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;padding:6px 0;border-bottom:1px solid var(--light)}
.zrow .zl{font-size:18px}
.zrow .zb{display:flex;gap:6px}
.zrow .zb button{margin:0;min-width:46px;padding:4px 10px}
.zrow.ok .zl::after{content:"  ✓";color:var(--ok);font-weight:700}
.zrow.bad .zl::after{content:"  ✗";color:var(--bad);font-weight:700}
.lines .z{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--card);display:flex;gap:12px;min-height:44px;align-items:center}
.lines .z .n{color:var(--grey);font-weight:700;min-width:22px}
.lines .z.ok{border-color:var(--ok);background:var(--okbg)} .lines .z.bad{border-color:var(--bad);background:var(--badbg)}
.quiz .q{font-size:20px;margin:6px 0 10px}
.quiz .timer{height:8px;background:var(--light);border-radius:5px;overflow:hidden;margin:8px 0}
.quiz .timer i{display:block;height:100%;background:var(--acc);width:100%}
.quiz .big{font:700 44px var(--f-head);color:var(--navy);text-align:center;margin:10px 0}
.quiz .qbody{max-width:720px}
.small{color:var(--grey);font-size:14px}
.info{border-radius:10px;padding:14px 18px;border:1px solid var(--navy);background:var(--light);font-size:18px;line-height:1.6}
.info b.t{color:var(--navy);font:700 21px var(--f-head)}
.m{font-family:var(--f-head);font-size:1.08em;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.92em}
.fr .nu{border-bottom:1.3px solid currentColor;padding:0 .15em .05em}
.fr .de{padding:.05em .15em 0}

/* Auswertung */
.final .big{font:700 40px var(--f-head);color:var(--navy);line-height:1.1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:8px 0}
.fcol{border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.fcol h4{margin:0 0 4px;color:var(--navy);font:700 16px var(--f-head)}
.fcol table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.fcol td{padding:1px 0;border-bottom:1px solid var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcol td:last-child{text-align:right;font-variant-numeric:tabular-nums;padding-left:6px;width:4.2em}
.credit{color:var(--grey);font-size:13px}

/* Navigation unten */
.nav{border-top:1px solid var(--line);background:var(--card);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav .inner{display:flex;align-items:center;gap:10px}
.nav .pos{flex:1;text-align:center;color:var(--grey);font-size:14px;line-height:1.3;min-width:0}
.nav button{margin:0;min-width:120px}

/* Merkkasten */
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);width:100%;max-width:900px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sheet-head h2{font:700 22px var(--f-head);color:var(--navy);margin:0}
.merkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.merkgrid .info{font-size:16.5px}

@media (max-width:1000px){.sliders{grid-template-columns:minmax(0,1fr)}.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){
  .split,.zu{grid-template-columns:minmax(0,1fr);gap:10px}
  .graph{max-height:none;min-height:0}
  .tile .mini{max-height:none}
  .nav .pos{display:none}
}
@media (max-width:700px){
  .tabs .inner{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);overflow-x:auto;padding-bottom:4px}
  .sliders{grid-template-columns:minmax(0,1fr)}
  .fields{grid-template-columns:minmax(0,1fr)}
  .nav button{min-width:0}
  .top h1{font-size:19px}
}
@media (max-width:480px){.fgrid{grid-template-columns:minmax(0,1fr)}.row .l{min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app" id="app" data-ut="Interaktive Phase – Partnerarbeit, ca. 20 Minuten">
  <header class="top gut"><div class="inner">
    <div class="tt"><h1>Das größte Rechteck</h1><span class="k">Mathematik GK Q2 · Zusammengesetzte Funktionen und Ableitungsregeln · Stunde 7</span></div>
    <span class="pts" id="pts">0 Punkte</span>
    <button type="button" class="merkbtn" id="merkbtn">Merkkasten</button>
  </div></header>
  <nav class="tabs gut" aria-label="Abschnitt wählen"><div class="inner" id="tabs"></div></nav>
  <div class="gut"><div class="inner"><div class="progress" id="progress"></div></div></div>
  <main class="stage gut" id="stage"></main>
  <footer class="nav gut"><div class="inner">
    <button type="button" class="sec" id="prevbtn">← Zurück</button>
    <span class="pos" id="pos"></span>
    <button type="button" id="nextbtn">Weiter →</button>
  </div></footer>
</div>

<div class="sheet" id="merk" hidden>
  <div class="sheet-in gut" role="dialog" aria-modal="true" aria-labelledby="merkTitle">
    <div class="sheet-head"><h2 id="merkTitle">Merkkasten</h2><button type="button" class="sec" id="merkclose">Schließen</button></div>
    <div class="merkgrid" id="merkgrid"></div>
  </div>
</div>
<script>
