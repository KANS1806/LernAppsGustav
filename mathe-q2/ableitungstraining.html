  if(good){els.forEach((e,k)=>{if(it.richtig.includes(order[k]))e.classList.add("ok");e.dataset.lock=1});fb(true,T.richtig+(it.erklaerung?" "+it.erklaerung:""));if(!STATE[id])award(id,fails?0:it.punkte,it.punkte);b.disabled=true}
  else{fails++;els.forEach(e=>{if(e.classList.contains("sel"))e.classList.add("bad");setTimeout(()=>e.classList.remove("bad"),900)});fb(false);
   if(fails>=2&&it.erklaerung)fb(false,T.falsch+" <br><b>Tipp:</b> "+it.erklaerung)}};
 return c};
function pairCell(v){return v.graph?staticGraph(v.graph,true):v.html}
R.zuordnen=(it,idx)=>{const c=card(it,idx,"Zuordnen");const id=mkTask(it,idx,c);const g=$("div","pairs");c.appendChild(g);
 const order=shuffledIdx(it.rechts.length);const sels=it.links.map((l,k)=>{g.appendChild($("div","left",pairCell(l)));
  const hasGraph=it.rechts.some(r=>r.graph);
  if(hasGraph){const w=$("div");const s={value:"",el:w};const btns=order.map((ri,j)=>{const bt=$("button","sec",String.fromCharCode(65+j));bt.onclick=()=>{btns.forEach(x=>x.classList.add("sec"));bt.classList.remove("sec");s.value=String(ri)};w.appendChild(bt);return bt});g.appendChild(w);return s}
  const s=$("select");s.innerHTML=`<option value="">${T.wahl}</option>`+order.map(ri=>`<option value="${ri}">${it.rechts[ri].html.replace(/<[^>]+>/g,"")}</option>`).join("");g.appendChild(s);return s});
 if(it.rechts.some(r=>r.graph)){const leg=$("div","tiles");order.forEach((ri,j)=>{leg.appendChild($("div","tile","<b>"+String.fromCharCode(65+j)+"</b>"+pairCell(it.rechts[ri])))});c.insertBefore(leg,g);c.insertBefore($("div","small","Graphen A–"+String.fromCharCode(64+order.length)+":"),leg)}
 const b=$("button",null,T.pruefen);c.appendChild(b);const fb=feedback(c);let fails=0;
 b.onclick=()=>{let ok=0;sels.forEach((s,k)=>{const good=s.value===String(k);if(s.el){s.el.style.outline=good?"3px solid var(--ok)":"3px solid var(--bad)"}else s.className=good?"ok":"bad";if(good)ok++});
  if(ok===sels.length){fb(true,T.richtig+(it.erklaerung?" "+it.erklaerung:""));if(!STATE[id])award(id,Math.max(0,it.punkte-fails),it.punkte)}else{fails++;fb(false,ok+" von "+sels.length+" richtig.")}};
 return c};
R.reihenfolge=(it,idx)=>{const c=card(it,idx,"Reihenfolge");const id=mkTask(it,idx,c);const wrap=$("div","steps");c.appendChild(wrap);
 c.insertBefore($("div","small","Tippe die Schritte in der richtigen Reihenfolge an."),wrap);
 const pool=$("div");const out=$("div");wrap.appendChild(out);wrap.appendChild(pool);let order=shuffledIdx(it.schritte.length),chosen=[];
 function draw(){pool.innerHTML="";out.innerHTML="";chosen.forEach((k,j)=>{const o=$("div","o",`<span class="n">${j+1}.</span><span>${it.schritte[k]}</span>`);o.dataset.k=k;out.appendChild(o)});
  order.forEach(k=>{const s=$("div","s"+(chosen.includes(k)?" used":""),it.schritte[k]);s.onclick=()=>{if(chosen.includes(k))return;chosen.push(k);draw()};pool.appendChild(s)})}
 draw();const b=$("button",null,T.pruefen);const rs=$("button","sec","Zurücksetzen");c.appendChild(b);c.appendChild(rs);const fb=feedback(c);let fails=0;
 rs.onclick=()=>{chosen=[];draw()};
 b.onclick=()=>{if(chosen.length<it.schritte.length){fb(false,"Bitte alle Schritte anordnen.");return}let ok=true;[...out.children].forEach((o,j)=>{const good=+o.dataset.k===j;o.classList.add(good?"ok":"bad");if(!good)ok=false});
  if(ok){fb(true,T.richtig+(it.erklaerung?" "+it.erklaerung:""));if(!STATE[id])award(id,fails?0:it.punkte,it.punkte)}else{fails++;fb(false)}};
 return c};
R.fehlersuche=(it,idx)=>{const c=card(it,idx,"Fehlersuche");const id=mkTask(it,idx,c);c.appendChild($("div","small","Tippe die Zeile an, in der der Fehler steckt."));
 const l=$("div","lines");c.appendChild(l);const fb=feedback(c);let fails=0,solved=false;
 it.zeilen.forEach((z,k)=>{const d=$("div","z",`<span class="n">${k+1}</span><span>${z}</span>`);l.appendChild(d);
  d.onclick=()=>{if(solved)return;if(k===it.fehler){d.classList.add("bad");solved=true;fb(true,"Gefunden! "+it.erklaerung+(it.korrektur?"<br><b>Richtig wäre:</b> "+it.korrektur:""));if(!STATE[id])award(id,fails?0:it.punkte,it.punkte)}
   else{fails++;d.classList.add("ok");fb(false,"Zeile "+(k+1)+" ist richtig. Such weiter!")}}});
 return c};
R.entdecken=(it,idx)=>{const c=card(it,idx,"Entdecken");const id=it.fragen.length?mkTask(it,idx,c):null;
 const f=parse(it.f);const g=it.vergleich?parse(it.vergleich):null;const env={};const gdiv=$("div");const ftx=$("div","ftx");
 const sl=$("div","sliders");Object.entries(it.par).forEach(([k,[mn,mx,st,start]])=>{env[k]=start;sl.appendChild($("span","pn",k));const r=$("input");r.type="range";r.min=mn;r.max=mx;r.step=st;r.value=start;
  const pv=$("span","pv",fmt(start));r.oninput=()=>{env[k]=parseFloat(r.value);pv.textContent=fmt(env[k]);draw()};sl.appendChild(r);sl.appendChild(pv)});
 function fmt(v){return String(+(+v).toFixed(3)).replace("-","−").replace(".",",")}
 function draw(){const fs=[];if(g)fs.push({fn:x=>g(Object.assign({},env,{x:x})),color:"var(--cmp)",dash:true});fs.push({fn:x=>f(Object.assign({},env,{x:x})),color:"var(--navy)"});
  gdiv.innerHTML=svgGraph({xlim:it.xlim,ylim:it.ylim,step:it.raster},fs,{});
  ftx.innerHTML=Object.keys(it.par).map(k=>`<span class="pvx"><i>${k}</i> = ${fmt(env[k])}</span>`).join("")}
 c.appendChild(gdiv);c.appendChild(ftx);c.appendChild(sl);if(g)c.appendChild($("div","small","Grau gestrichelt: Vergleichsgraph"));draw();
 if(it.fragen.length){let right=0;const answered=new Set();it.fragen.forEach((q,qi)=>{const qc=$("div");qc.style.marginTop="14px";qc.appendChild($("div",null,"<b>"+(qi+1)+".</b> "+q.text));
   const order=shuffledIdx(q.optionen.length);const els=optionsBlock(qc,order.map(k=>q.optionen[k]),q.richtig.length>1);const b=$("button","sec",T.pruefen);qc.appendChild(b);const fb=feedback(qc);let fails=0;
   b.onclick=()=>{const sel=els.map((e,k)=>e.classList.contains("sel")?order[k]:-1).filter(v=>v>=0).sort();const corr=q.richtig.slice().sort();const good=sel.length===corr.length&&sel.every((v,k)=>v===corr[k]);
    if(good){fb(true,T.richtig+(q.erklaerung?" "+q.erklaerung:""));b.disabled=true;if(!answered.has(qi)){answered.add(qi);if(!fails)right++}
     if(answered.size===it.fragen.length&&!STATE[id])award(id,right,it.fragen.length)}else{fails++;fb(false)}};c.appendChild(qc)})}
 return c};
R.quiz=(it,idx)=>{const c=card(it,idx,"Quiz");c.classList.add("quiz");const id=mkTask(it,idx,c);const body=$("div");c.appendChild(body);
 body.appendChild($("div","small",it.fragen.length+" Fragen · je "+it.sek+" Sekunden"));const st=$("button",null,T.start);body.appendChild(st);
 let qi=0,score=0,timer=null,order=[];
 st.onclick=()=>{order=shuffle([...Array(it.fragen.length).keys()]);qi=0;score=0;next()};
 function next(){clearInterval(timer);body.innerHTML="";if(qi>=order.length){body.appendChild($("div","big",score+" / "+order.length));body.appendChild($("div",null,T.fertig));
   if(!STATE[id]||STATE[id].p<score)award(id,score,it.punkte);const again=$("button","sec","Noch eine Runde");again.onclick=st.onclick;body.appendChild(again);return}
  const q=it.fragen[order[qi]];body.appendChild($("div","small","Frage "+(qi+1)+" von "+order.length+"  ·  "+score+" richtig"));
  const tb=$("div","timer");const ti=$("i");tb.appendChild(ti);body.appendChild(tb);body.appendChild($("div","q",q.text));if(q.graph)body.insertAdjacentHTML("beforeend",staticGraph(q.graph));
  const oo=shuffledIdx(q.optionen.length);let locked=false;const fb=$("div","fb");
  const els=oo.map(k=>{const d=$("div","opt",`<span class="box"></span><span>${q.optionen[k]}</span>`);d.onclick=()=>{if(locked)return;locked=true;clearInterval(timer);
    if(k===q.richtig){d.classList.add("ok");score++;fb.className="fb ok";fb.innerHTML=T.richtig}else{d.classList.add("bad");els[oo.indexOf(q.richtig)].classList.add("ok");fb.className="fb bad";fb.innerHTML="Leider falsch."}
    wb.disabled=false};body.appendChild(d);return d});
  body.appendChild(fb);const wb=$("button",null,T.weiter);wb.disabled=true;wb.onclick=()=>{qi++;next()};body.appendChild(wb);
  const t0=Date.now();timer=setInterval(()=>{const r=1-(Date.now()-t0)/(it.sek*1000);ti.style.width=Math.max(0,r*100)+"%";
   if(r<=0&&!locked){locked=true;clearInterval(timer);els[oo.indexOf(q.richtig)].classList.add("ok");fb.className="fb bad";fb.innerHTML=T.zeit;wb.disabled=false}},100)}
 return c};

const app=document.getElementById("app");
DATA.forEach((it,idx)=>{const el=R[it.typ](it,idx);app.appendChild(el)});
const fin=$("div","card final");fin.id="final";fin.innerHTML=`<div class="lab">Auswertung</div><div class="small">Bearbeite alle Aufgaben – dann erscheint hier deine Auswertung.</div>`;
const fb2=$("button","sec",T.auswerten);fb2.onclick=showFinal;fin.appendChild(fb2);

app.appendChild(fin);
function showFinal(){let got=0;let rows="";TASKS.forEach((t,k)=>{const s=STATE[t.id];const h=t.card.querySelector("h3");const lab=t.card.querySelector(".lab");const tx=(h?h.textContent:((lab?lab.textContent+": ":"")+(t.card.children[1]?t.card.children[1].textContent.slice(0,48)+"…":"")));rows+=`<tr><td>${k+1}. ${tx}</td><td>${s?(s.p+" / "+s.m):"–"}</td></tr>`;if(s)got+=s.p});
 fin.innerHTML=`<div class="lab">Auswertung</div><div class="big">${got} / ${total}</div><div>Punkte</div><table>${rows}</table><p>${T.fertig}</p>`;
 const r2=$("button","ghost","Alles zurücksetzen");r2.onclick=()=>{STATE={};save();location.reload()};fin.appendChild(r2)}
