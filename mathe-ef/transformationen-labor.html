:root[data-theme="dark"]{--bg:#0F1326;--card:#181D38;--text:#E4E7F2;--navy:#C9D3FF;--band:#1A2147;
--band-ink:#FFFFFF;--band-sub:#B8C6F5;--primary:#8FA2FF;--on-primary:#0F1326;--acc:#E59484;--cream:#2B2618;--cream-line:#5A4D2E;--light:#232A4D;
--blush:#2E1E22;--grey:#9AA3B8;--line:#3A4266;--grid:#283052;--cmp:#6B7280;--ok:#6FCF97;--okbg:#16321F;--bad:#F28B82;--badbg:#3A1C1C;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{background:var(--band);color:var(--band-ink);padding-block:22px 18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header .k{color:var(--band-sub);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
header h1{font:700 30px/1.2 Cambria,Caladea,Georgia,serif;margin:6px 0 4px;text-wrap:balance}
header .u{color:var(--band-sub);font-style:italic}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center}
.bar .prog{flex:1;height:10px;background:var(--light);border-radius:6px;overflow:hidden}
.bar .prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.bar .pts{font-weight:700;color:var(--navy);white-space:nowrap}
main{max-width:860px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.sec{font:700 22px/1.25 Cambria,Caladea,Georgia,serif;color:var(--navy);margin:28px 4px 6px}
.sect-text{margin:0 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px var(--shadow)}
.card .lab{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.card h3{margin:2px 0 8px;color:var(--navy);font-size:19px}
.card.done{border-left:6px solid var(--ok)}
.info{border-radius:10px;padding:12px 16px;margin:12px 0;border:1px solid var(--navy);background:var(--light)}
.info.tipp{background:var(--cream);border-color:var(--acc)}
.info b.t{color:var(--navy)}
button{font:inherit;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);padding:8px 16px;margin:6px 8px 0 0;cursor:pointer;min-height:44px}
button.sec{background:var(--card);color:var(--navy);border-color:var(--navy)}
button:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.ghost{background:var(--card);color:var(--acc);border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
input[type=text]{font:inherit;padding:8px 10px;border:1.5px dashed var(--acc);border-radius:8px;min-width:140px;min-height:44px;background:var(--card);color:var(--text)}
input[type=text].ok{border:2px solid var(--ok);background:var(--okbg)}
input[type=text].bad{border:2px solid var(--bad);background:var(--badbg)}
select{font:inherit;padding:8px;border:1.5px dashed var(--acc);border-radius:8px;min-height:44px;background:var(--card);color:var(--text);max-width:100%}
select.ok{border:2px solid var(--ok);background:var(--okbg)} select.bad{border:2px solid var(--bad);background:var(--badbg)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.row .l{font-weight:700;color:var(--navy);min-width:70px}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok);font-weight:700}
.fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.hint{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--cream);border:1px solid var(--cream-line)}
.sol{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--light);border-left:5px solid var(--navy)}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer;background:var(--card);min-height:44px}
.opt.sel{border-color:var(--navy);background:var(--light)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .box{width:20px;height:20px;border:2px solid var(--navy);border-radius:5px;flex:none}
.opt.sel .box{background:var(--navy)}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.pairs select{width:100%}
.pairs .left{background:var(--light);border-radius:8px;padding:8px 10px;min-height:44px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}.tile{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);flex:1 1 170px;max-width:240px}.tile b{color:var(--acc);font-size:18px}
.steps .s{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;background:var(--card);cursor:pointer;min-height:44px}
.steps .s.used{opacity:.35;cursor:default}
.steps .o{border:1.5px solid var(--navy);background:var(--light);border-radius:8px;padding:9px 12px;margin:6px 0;display:flex;gap:10px}
.steps .o.ok{border-color:var(--ok);background:var(--okbg)} .steps .o.bad{border-color:var(--bad);background:var(--badbg)}
.steps .n{font-weight:700;color:var(--navy);min-width:22px}
.lines .z{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--card);display:flex;gap:12px;min-height:44px;align-items:center}
.lines .z .n{color:var(--grey);font-weight:700;min-width:22px}
.lines .z.ok{border-color:var(--ok);background:var(--okbg)} .lines .z.bad{border-color:var(--bad);background:var(--badbg)}
.graph{width:100%;max-width:560px;display:block;margin:8px auto;background:var(--card);border-radius:8px}
.mini{width:100%;max-width:240px;display:block}
.sliders{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;margin:8px 0 4px}
.sliders .pn{font:italic 700 20px Cambria,Caladea,Georgia,serif;color:var(--navy)}
.sliders input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.sliders .pv{font-weight:700;min-width:52px;text-align:right}
.ftx .pvx{display:inline-block;margin:0 .9em;white-space:nowrap}
.ftx{font:20px Cambria,Caladea,Georgia,serif;color:var(--navy);text-align:center;margin:4px 0}
.quiz .q{font-size:19px;margin:6px 0 10px}
.quiz .timer{height:8px;background:var(--light);border-radius:5px;overflow:hidden;margin:8px 0}
.quiz .timer i{display:block;height:100%;background:var(--acc);width:100%}
.quiz .big{font:700 44px Cambria,Caladea,Georgia,serif;color:var(--navy);text-align:center;margin:10px 0}
.small{color:var(--grey);font-size:14px}
.final{text-align:center}
.final .big{font:700 52px Cambria,Caladea,Georgia,serif;color:var(--navy)}
.final table{margin:12px auto;border-collapse:collapse;text-align:left}
.final td{padding:4px 10px;border-bottom:1px solid var(--light)}
.m{font-family:Cambria,Caladea,Georgia,serif;font-size:1.08em;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.92em}
.fr .nu{border-bottom:1.3px solid currentColor;padding:0 .15em .05em}
.fr .de{padding:.05em .15em 0}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.75em;line-height:1}
.ss sup,.ss sub{position:static;font-size:1em}
.rt .rti{border-top:1.3px solid currentColor;padding:0 .1em}
footer{color:var(--grey);font-size:13px;text-align:center;padding:24px 12px 40px}

   while(k<w.length){let hit=fn.find(f=>w.startsWith(f,k));
    if(hit){tok.push({t:"f",v:hit});k+=hit.length;continue}

  throw new Error("Zeichen nicht erlaubt: "+c)}

  const aEnd=a.t==="n"||a.t==="v"||a.t==="c"||(a.t==="o"&&a.v===")");
  const bStart=b.t==="n"||b.t==="v"||b.t==="c"||b.t==="f"||(b.t==="o"&&b.v==="(");

  if(x.t==="o"&&x.v==="("){const n=expr();eat(")");return n}
  throw new Error("Fehler im Term")}

R.entdecken=(it,idx)=>{const c=card(it,idx,"Entdecken");const id=it.fragen.length?mkTask(it,idx,c):null;
